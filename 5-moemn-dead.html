<style>

    text-shadow:0 3px 0 #6b3d00,0 8px 18px #000a}

  .bigBtn{appearance:none;border:0;width:290px;max-width:80vw;min-height:60px;border-radius:18px;cursor:pointer;
    background:linear-gradient(#ffd469,#e09a1e);color:#3a2200;font-size:21px;font-weight:900;font-family:inherit;
    box-shadow:0 6px 0 #8a5a0e,0 10px 22px #0008}

  .ghostBtn{appearance:none;border:2px solid var(--line);background:var(--card);color:#e6edf7;width:290px;max-width:80vw;

  .lv{appearance:none;border:2px solid var(--line);background:linear-gradient(#1e2836,#151c26);color:#e6edf7;

  .upBuy{appearance:none;border:0;border-radius:10px;background:linear-gradient(#ffd469,#e09a1e);color:#3a2200;

  .coins{font-weight:900;color:#ffcf4a;font-size:16px}
  .pIcon{font-size:clamp(34px,8vmin,52px);line-height:1}
  .pTitle{margin:6px 0 4px;font-size:clamp(22px,5vmin,30px);font-weight:900;color:#ffcf4a;text-shadow:0 2px 0 #6b3d00}
  .pText{margin:0 0 14px;color:#b9c4d4;font-size:14px;line-height:1.65;font-weight:600}

  .shopRow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0;background:#101720;border:1px solid #232d3c;border-radius:12px;padding:8px 10px}

  .mini.on{border-color:#4ee06f;color:#4ee06f}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="ov" id="splash">

</div>
<div class="ov" id="home">
 <div class="stage" id="homeStage">
  <div class="left">

 </div>
</div>
<div class="ov" id="shopOv">

</div>

  </div>

</div>

    <button class="bigBtn" id="btnResume">كمّل</button>
    <button class="ghostBtn" id="btnRestart">من الأول</button>
    <button class="ghostBtn" id="btnQuit">القايمة</button>
  </div>
</div>
<script>
(function(){
'use strict';
var TAU=Math.PI*2;
function rnd(a,b){return a+Math.random()*(b-a)}
function rint(a,b){return Math.floor(a+Math.random()*(b-a+1))}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
var VW=1560,VH=720,GY=560,DPR=1,SX=1,OX=0,OY=0,W=0,H=0;
var cv=document.getElementById('cv'),ctx=cv.getContext('2d',{alpha:false});
var HOME_W=1240,HOME_H=560,homeStage=null;
function layout(){
  W=window.innerWidth;H=window.innerHeight;DPR=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.max(1,Math.round(W*DPR));cv.height=Math.max(1,Math.round(H*DPR));
  cv.style.width=W+'px';cv.style.height=H+'px';
  SX=Math.min((W*DPR)/VW,(H*DPR)/VH);OX=((W*DPR)-VW*SX)/2;OY=((H*DPR)-VH*SX)/2;
  fitHome();fitPanels();
}
function fitHome(){
  if(!homeStage)homeStage=document.getElementById('homeStage');if(!homeStage)return;
  var k=Math.min((window.innerWidth-24)/HOME_W,(window.innerHeight-24)/HOME_H);
  k=Math.max(0.25,Math.min(k,1.6));homeStage.style.transform='translate(-50%,-50%) scale('+k+')';
}
function fitPanels(){
  var vh=window.innerHeight,vw=window.innerWidth;
  ['over','pause','waveOv','shopOv'].forEach(function(id){
    var pn=document.querySelector('#'+id+' .panel');if(!pn)return;
    pn.style.transform='none';var h=pn.offsetHeight||1,w=pn.offsetWidth||1;
    var k=Math.min(1,(vh-22)/h,(vw-22)/w);pn.style.transform='scale('+k.toFixed(3)+')';
  });
}
function toV(cx,cy){return {x:(cx*DPR-OX)/SX,y:(cy*DPR-OY)/SX}}
/* ---------- defs ---------- */
var WT={
  fists:{n:'لكمات',k:'melee',dmg:14,rng:100,dur:0.26,combo:3,snd:'fists'},
  knife:{n:'سكينة',k:'melee',dmg:22,rng:112,dur:0.2,snd:'knife'},
  axe:{n:'فأس',k:'melee',dmg:50,rng:135,dur:0.5,snd:'axe'},
  saw:{n:'سيف منشار',k:'melee',dmg:30,rng:155,dur:0.27,snd:'axe'},
  pistol:{n:'مسدس',k:'gun',dmg:20,rate:0.27,ammo:Infinity,spread:0.02,snd:'pistol'},
  shotgun:{n:'شوزن',k:'gun',dmg:11,rate:0.8,ammo:30,pellets:6,spread:0.16,snd:'shotgun',rng:520},
  mg:{n:'رشاش',k:'gun',dmg:11,rate:0.085,ammo:240,spread:0.05,snd:'smg'},
  flame:{n:'لهب',k:'flame',dmg:6,rate:0.05,ammo:220,rng:270,snd:'flame'}
};
var WORD=['fists','knife','axe','saw','pistol','shotgun','mg','flame'];
var ZT={
  green:{sc:1,hp:62,spd:78,dmg:8,col:'#76c24a',xp:10},
  red:{sc:1,hp:105,spd:112,dmg:11,col:'#d6523c',xp:16},
  purple:{sc:1.08,hp:170,spd:66,dmg:16,col:'#8a58c8',xp:22},
  brute:{sc:1.5,hp:460,spd:48,dmg:28,col:'#5f9a3c',xp:50},
  boss:{sc:2.1,hp:2800,spd:56,dmg:40,col:'#3f8f3a',xp:300}
};
var ALLY=[
  {n:'سامي',w:'pistol',col:'#3aa0d8'},{n:'ريم',w:'mg',col:'#e08a3a'},{n:'كريم',w:'shotgun',col:'#8a6ad8'},
  {n:'نور',w:'knife',col:'#3ab88a'},{n:'هاني',w:'mg',col:'#d8584a'},{n:'منى',w:'pistol',col:'#c8a03a'}];
var MISSIONS=10;
var SAVE={mute:false,unlocked:1,wl:{},team:[0,1,3],al:[1,1,1,1,1,1]};
WORD.forEach(function(k){SAVE.wl[k]=1});
try{var raw=localStorage.getItem('mgd2');if(raw){var o=JSON.parse(raw);if(o){
  SAVE.mute=!!o.mute;SAVE.unlocked=clamp(o.unlocked|0,1,MISSIONS)||1;
  if(o.wl)WORD.forEach(function(k){SAVE.wl[k]=clamp(o.wl[k]|0,1,10)||1});
  if(Array.isArray(o.team))SAVE.team=o.team.filter(function(i){return i>=0&&i<6}).slice(0,3);
  if(Array.isArray(o.al))for(var i=0;i<6;i++)SAVE.al[i]=clamp(o.al[i]|0,1,10)||1;
}}}catch(e){}
function save(){try{localStorage.setItem('mgd2',JSON.stringify(SAVE))}catch(e){}}
function wmul(k){return 1+0.28*(SAVE.wl[k]-1)}
/* ---------- audio ---------- */
var AC=null;
function ac(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}
  if(AC&&AC.state==='suspended'){try{AC.resume()}catch(e){}}
  return AC;
}
function tone(f1,f2,dur,type,vol){
  var a=ac(); if(!a) return;
  var t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(f1,t);
  if(f2&&f2!==f1) o.frequency.exponentialRampToValueAtTime(Math.max(30,f2),t+dur);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol||0.05,t+0.006);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+0.02);
}
function noise(dur,vol,cut){
  var a=ac(); if(!a) return;
  var n=Math.floor(a.sampleRate*dur), buf=a.createBuffer(1,n,a.sampleRate), d=buf.getChannelData(0);
  for(var i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
  var s=a.createBufferSource(),g=a.createGain(),f=a.createBiquadFilter();
  s.buffer=buf; f.type='lowpass'; f.frequency.value=cut||900; g.gain.value=vol||0.1;
  s.connect(f); f.connect(g); g.connect(a.destination); s.start();
}
function sfx(k){
  if(SAVE.mute) return;
  switch(k){
    case 'pistol': tone(520,180,0.07,'square',0.045); break;
    case 'shotgun': noise(0.16,0.16,1400); tone(160,70,0.16,'sawtooth',0.05); break;
    case 'smg': tone(680,240,0.045,'square',0.03); break;
    case 'rifle': noise(0.2,0.16,900); tone(120,60,0.2,'sawtooth',0.06); break;
    case 'mg': tone(600,220,0.04,'square',0.026); break;
    case 'bat': tone(240,120,0.09,'triangle',0.05); break;
    case 'fists': noise(0.08,0.1,900); tone(180,90,0.07,'triangle',0.045); break;
    case 'knife': noise(0.1,0.09,2400); tone(700,300,0.06,'triangle',0.03); break;
    case 'axe': noise(0.14,0.13,1500); tone(260,110,0.12,'sawtooth',0.05); break;
    case 'flame': noise(0.12,0.07,700); break;
    case 'grenade': noise(0.4,0.2,600); tone(150,50,0.35,'sawtooth',0.07); break;
    case 'hit': tone(180,120,0.05,'square',0.02); break;
    case 'die': tone(160,80,0.2,'sawtooth',0.04); break;
    case 'pick': tone(900,1400,0.08,'sine',0.04); break;
    case 'hurt': tone(220,110,0.2,'sawtooth',0.07); break;
    case 'wave': tone(300,200,0.4,'sawtooth',0.05); break;
    case 'win': tone(523,523,0.12,'square',0.06); setTimeout(function(){tone(659,659,0.12,'square',0.06)},120); setTimeout(function(){tone(784,1046,0.24,'square',0.06)},240); break;
    case 'lose': tone(300,90,0.7,'sawtooth',0.08); break;
    case 'buy': tone(700,1100,0.1,'sine',0.05); break;
  }
}

/* ---------- art helpers ---------- */
function C(x,y,r,col){ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fillStyle=col;ctx.fill()}
function E(x,y,rx,ry,col){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,TAU);ctx.fillStyle=col;ctx.fill()}
function RR(x,y,w,h,r,col){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);ctx.fillStyle=col;ctx.fill()}
function LN(x1,y1,x2,y2,col,w){ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function limb(pts,fill,w){
  ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(pts[0],pts[1]);for(var i=2;i<pts.length;i+=2)ctx.lineTo(pts[i],pts[i+1]);
  ctx.strokeStyle='#000';ctx.lineWidth=w+6;ctx.stroke();
  if(fill!=='#000'){ctx.strokeStyle=fill;ctx.lineWidth=w;ctx.stroke()}
}
function mkBtn(r,c1,c2){
  var cvb=document.createElement('canvas');cvb.width=cvb.height=Math.ceil(r*2+12);var g=cvb.getContext('2d');
  var m=r+6;g.beginPath();g.arc(m,m,r,0,TAU);var gr=g.createRadialGradient(m-r*0.3,m-r*0.4,r*0.1,m,m,r);
  gr.addColorStop(0,'rgba(255,255,255,.95)');gr.addColorStop(0.25,c1);gr.addColorStop(1,c2);g.fillStyle=gr;g.fill();
  g.lineWidth=5;g.strokeStyle='rgba(0,0,0,.55)';g.stroke();
  g.beginPath();g.ellipse(m,m-r*0.42,r*0.55,r*0.28,0,0,TAU);g.fillStyle='rgba(255,255,255,.35)';g.fill();
  return cvb;
}
function mkArrow(dir){
  var cvb=document.createElement('canvas');cvb.width=190;cvb.height=130;var g=cvb.getContext('2d');
  g.translate(95,65);g.scale(dir,1);
  g.beginPath();g.moveTo(-84,0);g.lineTo(-20,-52);g.lineTo(-20,-24);g.lineTo(80,-24);g.lineTo(80,24);g.lineTo(-20,24);g.lineTo(-20,52);g.closePath();
  var gr=g.createLinearGradient(0,-52,0,52);gr.addColorStop(0,'#9fe8ff');gr.addColorStop(0.5,'#2f9ad8');gr.addColorStop(1,'#1c5a9a');
  g.fillStyle=gr;g.fill();g.lineWidth=6;g.strokeStyle='rgba(8,20,40,.8)';g.lineJoin='round';g.stroke();
  return cvb;
}
var BS={};
function initSprites(){
  BS.red=mkBtn(66,'#ff7a6a','#b01818');BS.green=mkBtn(52,'#9af07a','#1c8a2a');BS.blue=mkBtn(48,'#8ac4ff','#1a4fb8');
  BS.yellow=mkBtn(40,'#ffe27a','#c88a10');BS.sm=mkBtn(32,'#c9d4e0','#5a6678');BS.smOff=mkBtn(32,'#7a8696','#2e3644');
  BS.aL=mkArrow(1);BS.aR=mkArrow(-1);
}
/* ---------- figures ---------- */
function gunDraw(k){
  if(k==='pistol'){RR(0,-5,30,10,3,'#222');RR(4,3,10,15,3,'#222')}
  else if(k==='shotgun'){RR(-8,-6,66,10,3,'#3a2a1a');RR(30,-8,32,7,3,'#444');RR(-18,-3,14,12,3,'#5a3a1a')}
  else if(k==='mg'){RR(-10,-7,68,13,3,'#2a2a2a');RR(8,5,12,22,3,'#1a1a1a');RR(58,-4,22,7,2,'#555');RR(14,-12,18,6,2,'#555')}

  if(G.mech){G.mech.hp-=d;G.shake=0.15;if(G.mech.hp<=0){exitMech();}return}
  h.hp-=d;h.hurt=0.25;G.shake=0.2;sfx('hurt');
  if(h.hp<=0){h.hp=0;endGame(false)}
}
function exitMech(){if(!G.mech)return;G.hero.x=G.mech.x;G.hero.face=G.mech.face;boom(G.mech.x,GY-90,120,60);G.mech=null;G.hero.inv=1.2;say('خرجت من الروبوت')}

function fireBullet(x,y,vx,dmg,pierce,own){G.bl.push({x:x,y:y,vx:vx,dmg:dmg,life:0.9,p:pierce||0,own:own})}
function heroAttack(){
  var h=G.hero;if(G.over)return;
  if(G.mech){
    if(G.mech.fireCd<=0){G.mech.fireCd=0.06;G.mech.fire=0.07;sfx('mg');
      fireBullet(G.mech.x+G.mech.face*120,GY-98+rnd(-8,8),G.mech.face*1800,16+G.plvl,1);}
    return;
  }
  if(h.cd>0||h.dodge>0)return;
  var d=WT[h.w];var hm=G.hulkT>0?2.2:1;
  if(d.k==='melee'){
    h.atkT=d.dur;h.atk=0;h.hit=false;h.cd=d.dur*0.95;
    if(h.w==='fists'){h.ck=(h.comboT>0)?(h.ck+1)%3:0;h.comboT=0.55}
    sfx(d.snd);
  }else{
    var a=ammoOf(h.w);if(a<=0){say('الذخيرة خلصت');h.w='fists';return}
    h.cd=d.rate;h.flash=0.07;sfx(d.snd);var bx=h.x+h.face*70,by=GY-h.z-108;
    var dm=d.dmg*wmul(h.w)*hm;
    if(d.k==='flame'){
      h.ammo.flame-=1;
      for(var k=0;k<G.zs.length;k++){var z=G.zs[k];var dx=(z.x-h.x)*h.face;if(dx>0&&dx<d.rng+20*ZT[z.t].sc)dmgZ(z,dm,h.face,true)}
      for(var k=0;k<G.cr.length;k++){var c=G.cr[k];var dx2=(c.x-h.x)*h.face;if(dx2>0&&dx2<d.rng)hitCrate(c,3)}
      for(var k=0;k<3;k++)G.fl.push({x:bx,y:by+rnd(-8,8),vx:h.face*rnd(420,640),vy:rnd(-40,30),life:rnd(0.25,0.4),t:0});
    }else{
      var pel=d.pellets||1;
      for(var k=0;k<pel;k++)fireBullet(bx,by,h.face*1700,dm,0,'h');
      if(h.w!=='pistol')h.ammo[h.w]-=1;
      for(var k=0;k<pel;k++){G.bl[G.bl.length-1-k].vy=rnd(-d.spread,d.spread)*1700}
    }
  }
}
function heroJump(){var h=G.hero;if(G.mech){exitMech();return}if(h.z<=2){h.vz=980;}}
function heroDodge(){var h=G.hero;if(G.mech){mechStomp();return}if(h.dodgeCd>0||h.z>4)return;h.dodge=0.34;h.dodgeCd=0.8;h.inv=0.34;sfx('hit')}
function mechStomp(){var m=G.mech;if(m.st>0)return;m.st=1.2;G.shake=0.3;for(var i=G.zs.length-1;i>=0;i--){var z=G.zs[i];if(Math.abs(z.x-m.x)<230)dmgZ(z,120+G.plvl*6,z.x>m.x?1:-1)}G.fx.push({k:'b',x:m.x,y:GY-20,t:0,life:0.4,r:200});sfx('grenade')}

function skillHeli(){var h=G.hero;if(G.heliCd>0||h.mp<40){say(h.mp<40?'الطاقة مش كفاية':'الهليكوبتر مش جاهزة');return}h.mp-=40;G.heliCd=22;G.heli={sx:-200,t:0,fire:0};say('الهليكوبتر جاية');sfx('wave')}

/* ---------- update ---------- */
function nearestZ(x,range,face){
  var b=null,bd=1e9;for(var i=0;i<G.zs.length;i++){var z=G.zs[i];var d=Math.abs(z.x-x);if(face&&(z.x-x)*face<0)continue;if(d<range&&d<bd){bd=d;b=z}}return b;
}
function update(dt){
  var h=G.hero;G.t+=dt;
  if(G.msgT>0)G.msgT-=dt;if(G.shake>0)G.shake-=dt;
  if(G.comboT>0){G.comboT-=dt;if(G.comboT<=0)G.combo=0}
  if(G.heliCd>0)G.heliCd-=dt;if(G.mechCd>0)G.mechCd-=dt;if(G.hulkT>0)G.hulkT-=dt;
  h.mp=Math.min(100,h.mp+2.5*dt);
  if(h.cd>0)h.cd-=dt;if(h.flash>0)h.flash-=dt;if(h.hurt>0)h.hurt-=dt;if(h.inv>0)h.inv-=dt;if(h.dodgeCd>0)h.dodgeCd-=dt;
  if(h.comboT>0)h.comboT-=dt;
  var m=G.mech;
  if(m){
    m.life-=dt;m.t+=dt;if(m.fireCd>0)m.fireCd-=dt;if(m.fire>0)m.fire-=dt;if(m.st>0)m.st-=dt;
    var dir=(INP.r?1:0)-(INP.l?1:0);m.mv=dir!==0;if(dir){m.face=dir;m.x+=dir*250*dt}
    m.x=clamp(m.x,80,G.LW-80);h.x=m.x;
    if(INP.atk)heroAttack();
    if(m.life<=0)exitMech();
  }else{
    var dir=(INP.r?1:0)-(INP.l?1:0);
    if(h.dodge>0){h.dodge-=dt;h.x+=h.face*720*dt}
    else{
      h.mv=dir!==0;if(dir){h.face=dir;h.x+=dir*(G.hulkT>0?390:340)*dt;h.ph+=dt}
    }
    if(h.z>0||h.vz>0){h.z+=h.vz*dt;h.vz-=2700*dt;if(h.z<=0){h.z=0;h.vz=0}}
    if(INP.atk)heroAttack();
    if(h.atk>=0){h.atkT-=dt;var d=WT[h.w];var dur=d?d.dur:0.25;h.atk=1-clamp(h.atkT/dur,0,1);
      if(!h.hit&&h.atk>0.4&&d&&d.k==='melee'){
        h.hit=true;var hm=G.hulkT>0?2.2:1;var cb=1+Math.min(G.combo,20)*0.02;
        var kick=h.w==='fists'&&h.ck===2;var dm=d.dmg*wmul(h.w)*hm*cb*(kick?1.7:1);var any=false;
        for(var i=G.zs.length-1;i>=0;i--){var z=G.zs[i];var dx=(z.x-h.x)*h.face;if(dx>-20&&dx<d.rng+26*ZT[z.t].sc&&Math.abs(z.z-h.z)<120){dmgZ(z,dm,h.face);if(kick)z.kb=h.face*700;any=true}}
        for(var i=G.cr.length-1;i>=0;i--){var c=G.cr[i];if(!c)continue;var dx=(c.x-h.x)*h.face;if(dx>-10&&dx<d.rng+30){hitCrate(c,dm);any=true}}
        if(any)G.shake=Math.max(G.shake,0.05);
      }
      if(h.atkT<=0)h.atk=-1;
    }
    h.x=clamp(h.x,70,G.LW-70);
  }
  // pickups
  for(var i=G.pk.length-1;i>=0;i--){var p=G.pk[i];p.t+=dt;if(Math.abs(p.x-h.x)<60){G.pk.splice(i,1);
    if(p.k==='hp'){h.hp=Math.min(h.max,h.hp+50);addText(p.x,GY-140,'+50 صحة','#9fe87a')}
    else{h.ammo.shotgun=Math.min(40,(h.ammo.shotgun||0)+10);h.ammo.mg=Math.min(300,(h.ammo.mg||0)+100);h.ammo.flame=Math.min(260,(h.ammo.flame||0)+70);G.gren=Math.min(12,G.gren+2);addText(p.x,GY-140,'ذخيرة','#ffcf4a')}
    sfx('pick')}}
  // bullets
  for(var i=G.bl.length-1;i>=0;i--){var b=G.bl[i];b.x+=b.vx*dt;if(b.vy)b.y+=b.vy*dt;b.life-=dt;var gone=b.life<=0;
    if(!gone){
      for(var k=0;k<G.zs.length;k++){var z=G.zs[k];var s=ZT[z.t].sc*1.2;
        if(Math.abs(b.x-z.x)<26*s&&b.y>GY-z.z-170*s&&b.y<GY-z.z+4){dmgZ(z,b.dmg,b.vx>0?1:-1,true);G.fx.push({k:'s',x:b.x,y:b.y,t:0,life:0.2});if(b.p>0)b.p--;else{gone=true}break}}
      if(!gone)for(var k=0;k<G.cr.length;k++){var c=G.cr[k];var cy=GY-c.h*64-32;if(Math.abs(b.x-c.x)<34&&Math.abs(b.y-cy)<34){hitCrate(c,b.dmg);gone=true;break}}
    }
    if(gone)G.bl.splice(i,1);
  }
  // grenades
  for(var i=G.gr.length-1;i>=0;i--){var g=G.gr[i];g.x+=g.vx*dt;g.vy+=1500*dt;g.y+=g.vy*dt;var ex=false;
    if(g.y>=GY-12)ex=true;
    else for(var k=0;k<G.zs.length;k++){if(Math.abs(G.zs[k].x-g.x)<40&&g.y>GY-190){ex=true;break}}
    if(ex){G.gr.splice(i,1);boom(g.x,GY-20,200,170+G.plvl*8)}
  }
  for(var i=G.fl.length-1;i>=0;i--){var f=G.fl[i];f.t+=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;if(f.t>f.life)G.fl.splice(i,1)}
  for(var i=G.db.length-1;i>=0;i--){var d2=G.db[i];d2.life-=dt;d2.x+=d2.vx*dt;d2.y+=d2.vy*dt;d2.vy+=1400*dt;d2.rot+=dt*8;if(d2.y>GY+20){d2.y=GY+20;d2.vy*=-0.3;d2.vx*=0.6}if(d2.life<=0)G.db.splice(i,1)}
  for(var i=G.fx.length-1;i>=0;i--){var f2=G.fx[i];f2.t+=dt;if(f2.t>=f2.life)G.fx.splice(i,1)}
  // heli
  if(G.heli){var hl=G.heli;hl.t+=dt;hl.sx+=300*dt;hl.fire-=dt;
    if(hl.fire<=0){hl.fire=0.1;var cand=[];for(var i=0;i<G.zs.length;i++){var z=G.zs[i];if(z.x>G.cam-50&&z.x<G.cam+VW+50)cand.push(z)}
      if(cand.length){var z=cand[rint(0,cand.length-1)];dmgZ(z,36+G.plvl*3,1,true);G.fx.push({k:'tr',x:G.cam+hl.sx,y:150,x2:z.x,y2:GY-100,t:0,life:0.12})}
      sfx('smg')}
    if(hl.sx>VW+250)G.heli=null}
  // allies
  for(var i=0;i<G.allies.length;i++){
    var a=G.allies[i];a.ph+=dt;if(a.cd>0)a.cd-=dt;if(a.atk>=0){a.atk+=dt*4;if(a.atk>=1)a.atk=-1}
    var tz=nearestZ(a.x,a.w==='knife'?700:760);var want=h.x-70-i*85;var melee=(a.w==='knife');
    a.mv=false;
    if(tz&&melee){a.face=tz.x>a.x?1:-1;if(Math.abs(tz.x-a.x)>70){a.x+=a.face*260*dt;a.mv=true}else if(a.cd<=0){a.cd=0.55;a.atk=0;dmgZ(tz,14+a.lv*3,a.face)}}
    else{
      if(Math.abs(want-a.x)>14){var dr=want>a.x?1:-1;a.x+=dr*Math.min(290*dt,Math.abs(want-a.x));a.mv=true;if(!tz)a.face=dr}
      if(tz){a.face=tz.x>a.x?1:-1;if(a.cd<=0){a.cd=a.w==='mg'?0.14:(a.w==='shotgun'?0.9:0.45);a.atk=0.3;
        var n=a.w==='shotgun'?4:1;for(var k=0;k<n;k++)fireBullet(a.x+a.face*68,GY-108,a.face*1500,6+a.lv*1.6,0,'a');
        if(a.w==='shotgun'){for(var k=0;k<n;k++)G.bl[G.bl.length-1-k].vy=rnd(-160,160)}}}
    }
  }
  // zombies
  var tgx=m?m.x:h.x;
  for(var i=G.zs.length-1;i>=0;i--){
    var z=G.zs[i];var d=ZT[z.t];z.ph+=dt;if(z.hit>0)z.hit-=dt;if(z.cd>0)z.cd-=dt;
    if(Math.abs(z.kb)>5){z.x+=z.kb*dt;z.kb*=Math.pow(0.02,dt)}
    var tx=tgx,tow=false;
    if(G.tower){var dh=Math.abs(z.x-tgx);if(dh>260){tx=G.tower.x+70;tow=true}}
    var reach=(tow?46:58)*d.sc;var dx=tx-z.x;
    if(z.atk>=0){z.atk+=dt*2.2;
      if(z.atk>=0.5&&!z.did){z.did=true;
        if(tow){if(Math.abs(z.x-tx)<reach+40){G.tower.hp-=d.dmg;G.fx.push({k:'s',x:G.tower.x+80,y:GY-80,t:0,life:0.2});if(G.tower.hp<=0){G.tower.hp=0;endGame(false)}}}
        else if(Math.abs(z.x-tgx)<reach+34&&h.z<60)hurtHero(d.dmg*(1+(G.mode==='mission'?(G.m-1)*0.08:0)))}
      if(z.atk>=1){z.atk=-1;z.did=false}
    }else{
      z.face=dx>0?1:-1;
      if(Math.abs(dx)>reach){z.x+=z.face*z.spd*dt}
      else if(z.cd<=0){z.atk=0;z.did=false;z.cd=1.05}
    }
  }
  // camera
  if(G.mode==='mission'){var tgt=clamp(h.x-560,0,G.LW-VW);G.cam+=(tgt-G.cam)*Math.min(1,dt*6)}else G.cam=0;
  // progress
  if(G.mode==='mission'&&!G.over){
    for(var i=0;i<G.groups.length;i++){var g=G.groups[i];if(!g.done&&h.x>=g.x-420){g.done=true;
      for(var k=0;k<g.types.length;k++)spawnZ(g.types[k],G.cam+VW+60+k*115)}}
    if(!G.bossOn&&h.x>G.LW-1300){G.bossOn=true;spawnZ('boss',G.LW-260);say('الزعيم وصل')}
    if(G.bossOn){var alive=false;for(var i=0;i<G.zs.length;i++)if(G.zs[i].t==='boss')alive=true;if(!alive)endGame(true)}
  }else if(G.mode==='defense'&&!G.over){
    if(G.zs.length===0){G.wt=(G.wt||0)+dt;if(G.wt>2.2){G.wt=0;if(G.wave>=6)endGame(true);else nextWave()}}
  }
}
function endGame(win){
  if(G.over)return;G.over=true;G.state='end';
  var ti=document.getElementById('oTitle'),tx=document.getElementById('oText');
  if(win){if(G.mode==='mission'&&SAVE.unlocked<Math.min(MISSIONS,G.m+1))SAVE.unlocked=Math.min(MISSIONS,G.m+1);ti.textContent='كسبت!';sfx('win')}
  else{ti.textContent='خسرت';sfx('lose')}
  tx.innerHTML='قتلت <b>'+G.kills+'</b> زومبي · لفل <b>'+G.plvl+'</b>'+(win?'':'<br>جرّب تاني بأسلحة أقوى');
  document.getElementById('btnNext').style.display=(win&&G.mode==='mission'&&G.m<MISSIONS)?'':'none';
  save();setOv(document.getElementById('over'),true);
}

  demo:function(m,theme){setOv(elSplash,false);begin(m||1,'mission');if(theme){G.theme=theme;bgKey='';buildBG(theme,G.LW,5)}
    var h=G.hero;h.x=640;G.cam=140;G.t=455;G.plvl=3;G.combo=6;G.comboT=5;h.mp=80;
    ['green','red','purple','brute','green','red'].forEach(function(t,i){spawnZ(t,h.x+260+i*150)});
    G.zs.forEach(function(z){z.hp=z.max=9999;z.spd=0.01});G.cr.push(mkCrate(h.x+90,0,'crate'),mkCrate(h.x+90,1,'crate'),mkCrate(h.x-380,0,'barrel'));
    G.gren=9;h.w='saw';G.msgT=0;this.step(0.3)}
};
})();
