<style>

 </div>

<script>
(function(){
'use strict';
var TAU=Math.PI*2;
function rnd(a,b){return a+Math.random()*(b-a)}
function rint(a,b){return Math.floor(a+Math.random()*(b-a+1))}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}

/* ---------- layout ---------- */
var VW=1560, VH=720, DPR=1, SX=1, OX=0, OY=0, W=0, H=0;
var cv=document.getElementById('cv'), ctx=cv.getContext('2d',{alpha:false});
var GROUND=566, TOPH=96;
var HOME_W=1240, HOME_H=560, homeStage=null;
function layout(){
  W=window.innerWidth; H=window.innerHeight;
  DPR=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.max(1,Math.round(W*DPR)); cv.height=Math.max(1,Math.round(H*DPR));
  cv.style.width=W+'px'; cv.style.height=H+'px';
  SX=Math.min((W*DPR)/VW,(H*DPR)/VH);
  OX=((W*DPR)-VW*SX)/2; OY=((H*DPR)-VH*SX)/2;
  buildBG(); fitHome(); fitPanels();
}
function fitHome(){
  if(!homeStage) homeStage=document.getElementById('homeStage');
  if(!homeStage) return;
  var pad=12;
  var k=Math.min((window.innerWidth-pad*2)/HOME_W,(window.innerHeight-pad*2)/HOME_H);
  k=Math.max(0.25,Math.min(k,1.6));
  homeStage.style.transform='translate(-50%,-50%) scale('+k+')';
}
function fitPanels(){
  var vh=window.innerHeight, vw=window.innerWidth;
  ['over','pause','waveOv'].forEach(function(id){
    var pn=document.querySelector('#'+id+' .panel');
    if(!pn) return;
    pn.style.transform='none';
    var h=pn.offsetHeight||1, w=pn.offsetWidth||1;
    var k=Math.min(1,(vh-22)/h,(vw-22)/w);
    pn.style.transform='scale('+k.toFixed(3)+')';
  });
}
function toV(cx,cy){return {x:(cx*DPR-OX)/SX, y:(cy*DPR-OY)/SX}}

/* ---------- defs ---------- */
var WEAPONS={
  fists:{name:'لكمات',dmg:13,rate:0.24,ammo:Infinity,max:Infinity,kind:'melee',range:92},
  knife:{name:'سكينة',dmg:24,rate:0.3,ammo:Infinity,max:Infinity,kind:'melee',range:104},
  axe:{name:'فأس',dmg:42,rate:0.5,ammo:Infinity,max:Infinity,kind:'melee',range:118},
  pistol:{name:'مسدس',dmg:16,rate:0.26,ammo:Infinity,max:Infinity,kind:'bullet',range:1300},
  shotgun:{name:'شوزن',dmg:12,rate:0.85,ammo:10,max:10,pellets:6,spread:0.14,kind:'bullet',range:430},
  smg:{name:'رشاش',dmg:9,rate:0.085,ammo:70,max:70,spread:0.06,kind:'bullet',range:950},
  rifle:{name:'بندقية',dmg:58,rate:0.72,ammo:20,max:20,pierce:3,kind:'bullet',range:1700},
  mg:{name:'مدفع',dmg:15,rate:0.07,ammo:140,max:140,spread:0.075,kind:'bullet',range:1050},
  flame:{name:'لهب',dmg:7,rate:0.055,ammo:180,max:180,kind:'flame',range:250,spread:0.16},
  grenade:{name:'قنبلة',dmg:200,rate:1.15,ammo:6,max:6,kind:'grenade',radius:135,range:900}
};
var WORDER=['fists','knife','axe','pistol','shotgun','smg','rifle','mg','flame','grenade'];
var UNLOCK={fists:1,knife:1,axe:1,pistol:1,shotgun:1,smg:2,rifle:3,mg:4,flame:3,grenade:2};
var ZOMB={
  walker:{name:'زومبي',hp:70,spd:26,dmg:9,sc:1.7,coins:4,color:'#7fa86a',color2:'#5b7449'},
  runner:{name:'جرّاي',hp:55,spd:66,dmg:7,sc:1.55,coins:4,color:'#9ab86a',color2:'#6f8a4a'},
  brute:{name:'تقيل',hp:330,spd:19,dmg:22,sc:2.55,coins:12,color:'#6b8a5a',color2:'#4e6a42'},
  spitter:{name:'بلّاع',hp:95,spd:23,dmg:11,sc:1.7,coins:7,color:'#8aa86a',color2:'#637f4a',ranged:true},
  boss:{name:'الزعيم',hp:2800,spd:15,dmg:40,sc:3.6,coins:90,color:'#5f7a4a',color2:'#44603a'}
};
var WAVES=8, LEVELS=5;
var UPS=[
  {id:'dmg',name:'الضرر',desc:'+12% لكل سلاح',costs:[120,220,380,600,900]},
  {id:'hp',name:'الصحة',desc:'+25 صحة',costs:[100,200,340,520,760]},
  {id:'rate',name:'سرعة الإطلاق',desc:'+8% أسرع',costs:[140,260,420,650,980]}
];

/* ---------- save ---------- */
var SAVE={mute:false,coins:0,unlocked:1,up:{dmg:0,hp:0,rate:0},best:[0,0,0,0,0],allies:0};
try{var raw=localStorage.getItem('mgd_save');if(raw){var o=JSON.parse(raw);
  if(o&&typeof o==='object'){
    SAVE.mute=!!o.mute; SAVE.coins=o.coins|0; SAVE.unlocked=clamp(o.unlocked|0,1,LEVELS)||1;
    if(o.up){SAVE.up.dmg=clamp(o.up.dmg|0,0,5);SAVE.up.hp=clamp(o.up.hp|0,0,5);SAVE.up.rate=clamp(o.up.rate|0,0,5)}
    if(Array.isArray(o.best))SAVE.best=o.best.slice(0,LEVELS);
    SAVE.allies=clamp(o.allies|0,0,6);
  }}}catch(e){}
function save(){try{localStorage.setItem('mgd_save',JSON.stringify(SAVE))}catch(e){}}
function dmgMul(){var m=1+SAVE.up.dmg*0.12; if(G&&G.hulkT>0)m*=2.5; return m*(1+(G&&G.plvl?G.plvl-1:0)*0.05)}
function rateMul(){return 1/(1+SAVE.up.rate*0.08)}
function maxHP(){return 100+SAVE.up.hp*25}

/* ---------- audio ---------- */
var AC=null;
function ac(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}
  if(AC&&AC.state==='suspended'){try{AC.resume()}catch(e){}}
  return AC;
}
function tone(f1,f2,dur,type,vol){
  var a=ac(); if(!a) return;
  var t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(f1,t);
  if(f2&&f2!==f1) o.frequency.exponentialRampToValueAtTime(Math.max(30,f2),t+dur);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol||0.05,t+0.006);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+0.02);
}
function noise(dur,vol,cut){
  var a=ac(); if(!a) return;
  var n=Math.floor(a.sampleRate*dur), buf=a.createBuffer(1,n,a.sampleRate), d=buf.getChannelData(0);
  for(var i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
  var s=a.createBufferSource(),g=a.createGain(),f=a.createBiquadFilter();
  s.buffer=buf; f.type='lowpass'; f.frequency.value=cut||900; g.gain.value=vol||0.1;
  s.connect(f); f.connect(g); g.connect(a.destination); s.start();
}
function sfx(k){
  if(SAVE.mute) return;
  switch(k){
    case 'pistol': tone(520,180,0.07,'square',0.045); break;
    case 'shotgun': noise(0.16,0.16,1400); tone(160,70,0.16,'sawtooth',0.05); break;
    case 'smg': tone(680,240,0.045,'square',0.03); break;
    case 'rifle': noise(0.2,0.16,900); tone(120,60,0.2,'sawtooth',0.06); break;
    case 'mg': tone(600,220,0.04,'square',0.026); break;
    case 'bat': tone(240,120,0.09,'triangle',0.05); break;
    case 'fists': noise(0.08,0.1,900); tone(180,90,0.07,'triangle',0.045); break;
    case 'knife': noise(0.1,0.09,2400); tone(700,300,0.06,'triangle',0.03); break;
    case 'axe': noise(0.14,0.13,1500); tone(260,110,0.12,'sawtooth',0.05); break;
    case 'flame': noise(0.12,0.07,700); break;
    case 'grenade': noise(0.4,0.2,600); tone(150,50,0.35,'sawtooth',0.07); break;
    case 'hit': tone(180,120,0.05,'square',0.02); break;
    case 'die': tone(160,80,0.2,'sawtooth',0.04); break;
    case 'pick': tone(900,1400,0.08,'sine',0.04); break;
    case 'hurt': tone(220,110,0.2,'sawtooth',0.07); break;
    case 'wave': tone(300,200,0.4,'sawtooth',0.05); break;
    case 'win': tone(523,523,0.12,'square',0.06); setTimeout(function(){tone(659,659,0.12,'square',0.06)},120); setTimeout(function(){tone(784,1046,0.24,'square',0.06)},240); break;
    case 'lose': tone(300,90,0.7,'sawtooth',0.08); break;
    case 'buy': tone(700,1100,0.1,'sine',0.05); break;
  }
}

/* ---------- art helpers ---------- */
function grad(x1,y1,x2,y2,stops){var g=ctx.createLinearGradient(x1,y1,x2,y2);for(var i=0;i<stops.length;i++)g.addColorStop(stops[i][0],stops[i][1]);return g}
function rgrad(x,y,r0,r1,stops){var g=ctx.createRadialGradient(x,y,r0,x,y,r1);for(var i=0;i<stops.length;i++)g.addColorStop(stops[i][0],stops[i][1]);return g}
function E(x,y,rx,ry,col,rot){ctx.beginPath();ctx.ellipse(x,y,rx,ry,rot||0,0,TAU);ctx.fillStyle=col;ctx.fill()}
function C(x,y,r,col){ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fillStyle=col;ctx.fill()}
function RR(x,y,w,h,r,col){ctx.beginPath();if(ctx.roundRect){ctx.roundRect(x,y,w,h,r)}else{ctx.rect(x,y,w,h)}ctx.fillStyle=col;ctx.fill()}
function line(x1,y1,x2,y2,col,w){ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}

/* ---------- background ---------- */
var bg=document.createElement('canvas'), bgc=bg.getContext('2d');
function buildBG(){
  bg.width=Math.max(1,Math.round(W*DPR)); bg.height=Math.max(1,Math.round(H*DPR));
  bgc.setTransform(1,0,0,1,0,0); bgc.clearRect(0,0,bg.width,bg.height);
  bgc.setTransform(SX,0,0,SX,OX,OY);
  var sky=bgc.createLinearGradient(0,0,0,GROUND);
  sky.addColorStop(0,'#1d2a3c'); sky.addColorStop(.45,'#2f4258'); sky.addColorStop(.8,'#46596f'); sky.addColorStop(1,'#5b6c82');
  bgc.fillStyle=sky; bgc.fillRect(-400,-400,VW+800,GROUND+400);
  for(var i=0;i<150;i++){
    var sx=rnd(-40,VW+40), sy=rnd(0,GROUND-180);
    bgc.fillStyle='rgba(255,255,255,'+rnd(.08,.5).toFixed(2)+')';
    bgc.fillRect(sx,sy,rnd(.8,2),rnd(.8,2));
  }
  var mg=bgc.createRadialGradient(VW*0.72,140,10,VW*0.72,140,190);
  mg.addColorStop(0,'rgba(220,235,255,.55)'); mg.addColorStop(.4,'rgba(180,205,240,.16)'); mg.addColorStop(1,'rgba(160,190,230,0)');
  bgc.fillStyle=mg; bgc.beginPath(); bgc.arc(VW*0.72,140,190,0,TAU); bgc.fill();
  bgc.fillStyle='#dfe9f7'; bgc.beginPath(); bgc.arc(VW*0.72,140,44,0,TAU); bgc.fill();
  bgc.fillStyle='rgba(190,205,225,.5)'; bgc.beginPath(); bgc.arc(VW*0.72-12,130,9,0,TAU); bgc.fill();
  bgc.beginPath(); bgc.arc(VW*0.72+14,152,6,0,TAU); bgc.fill();
  var x=-60;
  while(x<VW+80){
    var bw=rnd(60,140), bh=rnd(110,300), by=GROUND-70-bh;
    bgc.fillStyle='#1a2431'; bgc.fillRect(x,by,bw,bh+70);
    for(var wy=by+18;wy<GROUND-90;wy+=26){
      for(var wx=x+10;wx<x+bw-12;wx+=22){
        if(Math.random()<0.32){ bgc.fillStyle='rgba(255,214,140,'+rnd(.25,.7).toFixed(2)+')'; bgc.fillRect(wx,wy,9,12) }
      }
    }
    x+=bw+rnd(6,20);
  }

var G={state:'home',level:1,wave:0,hero:null,zombies:[],pickups:[],fx:[],spits:[],t:0,
  spawnQ:[],cool:0,runCoins:0,waveActive:false,flash:'',flashT:0,shake:0,kills:0,

function heroBase(){return {x:420,hp:maxHP(),max:maxHP(),ph:0,moving:false,weapon:'pistol',

function resetLevel(n){
  G.level=n; G.wave=0; G.hero=heroBase(); G.zombies=[]; G.pickups=[]; G.fx=[]; G.spits=[];
  G.t=0; G.spawnQ=[]; G.cool=0; G.runCoins=0; G.waveActive=false; G.kills=0; G.flash=''; G.flashT=0; G.shake=0;

}
function flash(msg){G.flash=msg;G.flashT=2}
function wavePlan(w){
  var hpMul=1+0.28*(G.level-1)+0.11*(w-1);
  var q=[];
  if(w===WAVES){
    q.push({type:'boss',at:1.2,hpMul:hpMul});
    for(var i=0;i<4+Math.floor(G.level*1.2);i++) q.push({type:'walker',at:2+i*1.4,hpMul:hpMul});
    return q;
  }
  var n=5+Math.floor(w*1.6)+Math.floor(G.level*1.2);
  for(var i=0;i<n;i++){
    var pool=['walker','walker','runner'];
    if(w>=2) pool.push('spitter');
    if(w>=3) pool.push('brute');
    if(G.level>=2&&w>=2) pool.push('runner');
    var t=pool[rint(0,pool.length-1)];
    q.push({type:t,at:0.6+i*rnd(0.7,1.5),hpMul:hpMul});
  }
  return q;
}
function startWave(){
  G.wave++; G.waveActive=true; G.spawnQ=wavePlan(G.wave); G.t=0;
  setOv(document.getElementById('waveOv'),false);
  flash('الموجة '+G.wave+' من '+WAVES);

function spawnZ(type,hpMul){

function nearestZ(x,y){
  var best=null,bd=1e9;
  for(var i=0;i<G.zombies.length;i++){

function fireAt(z){
  var h=G.hero, w=WEAPONS[h.weapon];
  if(G.cool>0) return;
  if(h.ammo[h.weapon]<=0){ flash('الذخيرة خلصت'); switchTo('pistol'); return }
  G.cool=w.rate*rateMul();
  h.flash=0.09;
  h.aimX=z?z.x:VW-200; h.aimY=z?(GROUND-70*d0(z)):GROUND-80;
  var ang=Math.atan2(h.aimY-(GROUND-80*HS),(h.aimX-h.x));
  var mx=h.x+Math.cos(ang)*46*HS, my=(GROUND-80*HS)+Math.sin(ang)*46*HS;
  sfx(h.weapon);
  if(w.kind==='melee'){
    for(var i=0;i<G.zombies.length;i++){
      var zz=G.zombies[i];
      if(Math.abs(zz.x-h.x)<w.range && Math.abs((GROUND-70*d0(zz))-(GROUND-80*HS))<150) hitZombie(zz,w.dmg*dmgMul(),mx,my);
    }
    addFx('trace',mx,my,{x1:mx,y1:my,x2:mx+Math.cos(ang)*70,y2:my+Math.sin(ang)*70,col:'#ffd9a0',w:6});
    return;
  }
  if(w.kind==='flame'){
    if(h.ammo.flame<=0){ flash('الوقود خلص'); switchTo('pistol'); return }
    h.ammo.flame--;
    for(var i=0;i<G.zombies.length;i++){
      var zz=G.zombies[i];
      var dxz=zz.x-h.x;
      if(dxz>0&&dxz<w.range) hitZombie(zz,w.dmg*dmgMul()*(1-dxz/w.range*0.5),zz.x-20,GROUND-70*d0(zz));
    }
    for(var i=0;i<4;i++) addFx('flame',mx+Math.cos(ang)*rnd(20,w.range*0.9),my+Math.sin(ang)*rnd(-24,24)+rnd(-16,16),{col:'#ffb04a'});
    return;
  }
  if(w.kind==='grenade'){
    if(h.ammo.grenade<=0){ flash('مفيش قنابل'); switchTo('pistol'); return }
    h.ammo.grenade--;
    var tx=clamp(z?z.x:h.aimX,h.x+120,VW-80);
    G.grenades=G.grenades||[];
    G.grenades.push({x:mx,y:my,vx:(tx-mx)/0.55,vy:-260,g:900,t:0});
    return;
  }
  // bullets
  var pellets=w.pellets||1, hits=0;
  for(var p=0;p<pellets;p++){
    var a=ang+(pellets>1?rnd(-w.spread,w.spread):(w.spread?rnd(-w.spread,w.spread):0));
    var dx=Math.cos(a), dy=Math.sin(a);
    var endX=mx+dx*w.range, endY=my+dy*w.range;
    var bestT=1e9,bestZ=null;
    for(var i=0;i<G.zombies.length;i++){
      var zz=G.zombies[i];
      var zy=GROUND-70*d0(zz);
      var rel=(zz.x-mx)/dx;
      if(rel<20) continue;
      var yy=my+dy*rel;
      if(Math.abs(yy-zy)<44*ZOMB[zz.type].sc && rel<bestT){bestT=rel;bestZ=zz}
    }
    if(bestZ){ endX=mx+dx*bestT; endY=my+dy*bestT; hitZombie(bestZ,w.dmg*dmgMul(),endX,endY) }
    addFx('trace',mx,my,{x1:mx,y1:my,x2:endX,y2:endY,col:h.weapon==='rifle'?'#ffe08a':'#ffe9a8',w:h.weapon==='mg'?2:2.6});
  }
  if(h.ammo[h.weapon]!==Infinity) h.ammo[h.weapon]--;
  if(h.ammo[h.weapon]===0){ flash('الذخيرة خلصت'); switchTo('pistol') }
}
function hitZombie(z,dmg,x,y){
  z.hp-=dmg; z.hitT=0.16;

function killZ(z){
  var i=G.zombies.indexOf(z);

  G.zombies.splice(i,1); G.kills++;

  addCoins(d.coins,z.x,y0());
  addXP(d.coins*3); G.rage=Math.min(100,G.rage+(z.type==='boss'?40:9));
  sfx('die');
  addFx('impact',z.x,GROUND-60*d.sc,{col:'#7aa85a'});

  else if(r<0.18) G.pickups.push({kind:'ammo',x:z.x,t:0});
  else if(r<0.26) G.pickups.push({kind:'hp',x:z.x,t:0});
}

/* ---------- update ---------- */
function update(dt){
  G.t+=dt;
  var h=G.hero;
  if(G.flashT>0)G.flashT-=dt;
  if(G.shake>0)G.shake-=dt;
  if(G.cool>0)G.cool-=dt;
  if(G.heliCd>0)G.heliCd-=dt;
  if(G.hulkT>0)G.hulkT-=dt;
  if(h.flash>0)h.flash-=dt;
  if(h.hurtT>0)h.hurtT-=dt;
  // move
  if(h.moveTo!=null){
    var dx=h.moveTo-h.x;
    if(Math.abs(dx)>6){ h.x+=Math.sign(dx)*Math.min(Math.abs(dx),260*dt); h.moving=true; h.ph+=dt*2.2 }
    else { h.x=h.moveTo; h.moveTo=null; h.moving=false }
  } else h.moving=false;
  h.x=clamp(h.x,120,VW-260);
  // allies
  for(var i=0;i<G.allies.length;i++){
    var al=G.allies[i];
    if(al.flash>0)al.flash-=dt;
    al.ph+=dt;
    var tz=nearestZ(al.x,GROUND-80*HS);
    if(tz){
      var want=tz.x-250-al.slot*90; al.x+=clamp(want-al.x,-190*dt,190*dt);
      al.cd-=dt;
      if(al.cd<=0){ al.cd=0.85; al.flash=0.09;
        var aA=Math.atan2((GROUND-70*d0(tz))-(GROUND-80*HS*0.82),tz.x-al.x);
        var ax=al.x+Math.cos(aA)*40*HS*0.8, ay=(GROUND-80*HS*0.82)+Math.sin(aA)*40*HS*0.8;
        addFx('trace',ax,ay,{x1:ax,y1:ay,x2:tz.x,y2:GROUND-70*d0(tz),col:'#bfe0ff',w:2});
        hitZombie(tz,14*dmgMul(),tz.x,GROUND-70*d0(tz));
      }
    }
  }
  // spawn queue
  for(var i=G.spawnQ.length-1;i>=0;i--){
    var q=G.spawnQ[i];
    if(G.t>=q.at){ spawnZ(q.type,q.hpMul); G.spawnQ.splice(i,1) }
  }
  // zombies
  for(var i=G.zombies.length-1;i>=0;i--){
    var z=G.zombies[i];
    if(z.hitT>0)z.hitT-=dt;
    z.ph+=dt*(z.type==='runner'?2.4:1.5);
    var d=ZOMB[z.type];
    var reach = d.ranged?330:46*d.sc;
    var dx2=h.x-z.x;
    if(Math.abs(dx2)>reach){ z.x+=Math.sign(dx2)*d.spd*dt; z.attacking=false }
    else {
      z.attacking=true;
      z.cd-=dt;
      if(z.cd<=0){
        z.cd=d.ranged?2.2:1.1;
        if(d.ranged){
          G.spits.push({x:z.x,y:GROUND-70*d.sc,vx:(h.x-z.x)*0.9,vy:-160,t:0});
          sfx('hit');
        } else hurtHero(z.dmg);
      }
    }
  }
  // grenades
  if(G.grenades){
    for(var i=G.grenades.length-1;i>=0;i--){
      var g=G.grenades[i]; g.t+=dt;
      g.x+=g.vx*dt; g.y+=g.vy*dt; g.vy+=g.g*dt;
      if(g.y>=GROUND-8||g.t>1.4){
        G.grenades.splice(i,1);
        addFx('boom',g.x,GROUND-20,{r:WEAPONS.grenade.radius});
        sfx('grenade');
        for(var j=G.zombies.length-1;j>=0;j--){
          var z=G.zombies[j];
          if(Math.abs(z.x-g.x)<WEAPONS.grenade.radius) hitZombie(z,WEAPONS.grenade.dmg*dmgMul(),z.x,GROUND-70*d0(z));
        }
        G.shake=0.3;
      }
    }
  }
  // spits
  for(var i=G.spits.length-1;i>=0;i--){
    var s=G.spits[i]; s.t+=dt;
    s.x+=s.vx*dt; s.y+=s.vy*dt; s.vy+=700*dt;
    if(s.y>GROUND-30||s.t>2.2){
      G.spits.splice(i,1);
      addFx('impact',s.x,GROUND-40,{col:'#a8d06a'});
      if(Math.abs(s.x-h.x)<50) hurtHero(9+2*G.level);
    }
  }
  // pickups
  for(var i=G.pickups.length-1;i>=0;i--){
    var p=G.pickups[i]; p.t+=dt;
    if(Math.abs(p.x-h.x)<70){
      G.pickups.splice(i,1);
      if(p.kind==='hp'){ h.hp=Math.min(h.max,h.hp+25); addFx('text',p.x,GROUND-130,{txt:'+25 صحة',col:'#8ad06a'}) }
      else if(p.kind==='ammo'){
        var cur=WEAPONS[h.weapon].kind==='melee'?'smg':h.weapon;
        var wd=WEAPONS[cur];
        if(wd.max!==Infinity){ h.ammo[cur]=Math.min(wd.max,h.ammo[cur]+Math.ceil(wd.max*0.45)); addFx('text',p.x,GROUND-130,{txt:'ذخيرة',col:'#ffcf4a'}) }
        else { h.ammo.shotgun=Math.min(WEAPONS.shotgun.max,h.ammo.shotgun+5); addFx('text',p.x,GROUND-130,{txt:'+5 شوزن',col:'#ffcf4a'}) }
      }
      sfx('pick');
    }
  }
  // fx
  for(var i=G.fx.length-1;i>=0;i--){var f=G.fx[i];f.t+=dt;if(f.t>=f.life)G.fx.splice(i,1)}
  // wave end
  if(G.waveActive && G.spawnQ.length===0 && G.zombies.length===0){
    G.waveActive=false;
    if(G.wave>=WAVES){ endGame(true); return }
    showWavePanel();
  }
}
function showWavePanel(){

  bt.textContent = nx===WAVES?'واجه الزعيم':'ابدأ الموجة';

function endGame(win){
  if(G.state==='win'||G.state==='lose') return;

  SAVE.coins+=G.runCoins;
  if(win && SAVE.unlocked<Math.min(LEVELS,G.level+1)) SAVE.unlocked=Math.min(LEVELS,G.level+1);
  var sc=G.kills*5+G.runCoins;
  if(sc>(SAVE.best[G.level-1]||0)) SAVE.best[G.level-1]=sc;

  }

}

function render(){

  if(G.state==='home'||!G.hero) return;
  var sh=G.shake>0?Math.sin(G.shake*60)*5*G.shake:0;
  ctx.translate(sh,0);
  for(var i=0;i<G.pickups.length;i++) drawPickup(G.pickups[i]);
  var zs=G.zombies.slice().sort(function(a,b){return a.x-b.x});
  for(var i=0;i<zs.length;i++) drawZombie(zs[i]);
  for(var i=0;i<G.allies.length;i++) drawAlly(G.allies[i]);
  if(G.hulkT>0){ ctx.globalAlpha=.28; C(G.hero.x,GROUND-90*HS,60*HS*0.5,'#ff5a3a'); ctx.globalAlpha=1 }
  drawHero();
  if(G.grenades) for(var i=0;i<G.grenades.length;i++){ var g=G.grenades[i]; C(g.x,g.y,7,'#3f5a35'); C(g.x-2,g.y-2,2.5,'#8aa86a') }

/* ---------- input ---------- */
function tap(cx,cy){
  var v=toV(cx,cy);
  if(G.state==='between') return;
  if(G.state!=='play') return;
  if(v.x>=pauseRect.x&&v.x<=pauseRect.x+pauseRect.w&&v.y>=pauseRect.y&&v.y<=pauseRect.y+pauseRect.h){pauseGame();return}
  function hitRect(r){return v.x>=r.x&&v.x<=r.x+r.w&&v.y>=r.y&&v.y<=r.y+r.h}
  if(hitRect(heliRect)){ heliStrike(); return }
  if(hitRect(hulkRect)){ activateHulk(); return }
  for(var i=0;i<WORDER.length;i++){
    var r=wbtnRect(i);
    if(v.x>=r.x&&v.x<=r.x+r.w&&v.y>=r.y&&v.y<=r.y+r.h){ switchTo(WORDER[i]); return }
  }
  if(v.y>BAR_Y-16) return;
  // tap a zombie -> shoot it
  var best=null,bd=1e9;
  for(var i=0;i<G.zombies.length;i++){
    var z=G.zombies[i], zy=GROUND-70*d0(z);
    var d=Math.hypot(z.x-v.x,zy-v.y);
    if(d<90*ZOMB[z.type].sc&&d<bd){bd=d;best=z}
  }
  if(best){ fireAt(best); return }
  // else move
  G.hero.moveTo=clamp(v.x,140,VW-280);
  G.hero.aimX=v.x; G.hero.aimY=v.y;
}

    G.plvl=3; G.xp=70; G.rage=100;
    window.__mgd.step(0.5);
  },
  state:function(){return {state:G.state,level:G.level,wave:G.wave,z:G.zombies.length,hp:G.hero?Math.round(G.hero.hp):0,
    coins:G.runCoins,kills:G.kills,weapon:G.hero?G.hero.weapon:null,x:G.hero?Math.round(G.hero.x):0}},
  gold:function(v){G.runCoins=v},
  unlock:function(v){SAVE.unlocked=v||LEVELS;syncHome()},
  allies:function(n){SAVE.allies=n|0;syncHome()},
  heli:function(){heliStrike()},
  hulk:function(){G.rage=100;activateHulk()},
  rage:function(v){G.rage=v},
  coins:function(v){SAVE.coins=v;syncHome()},
  weapon:function(w){switchTo(w)},
  tap:function(x,y){ var sx=(x*SX+OX)/DPR, sy=(y*SX+OY)/DPR; tap(sx,sy) },
  spawn:function(t,x){ var d=ZOMB[t||'walker']; G.zombies.push({type:t||'walker',x:x||VW-120,hp:d.hp,max:d.hp,
    dmg:d.dmg,spd:d.spd,ph:rnd(0,6),hitT:0,attacking:false,cd:1,face:1}) },
  fire:function(){ var z=G.zombies[0]; if(z) fireAt(z) },
  step:function(sec){ var n=Math.round((sec||1)*60); for(var i=0;i<n;i++){ if(G.state==='play') update(1/60) } render() },
  scene:function(n){
    setOv(elSplash,false); setOv(elHome,false); resetLevel(n||2); G.wave=3; G.waveActive=true; G.spawnQ=[];
    var types=['walker','walker','runner','spitter','brute','walker','runner'];
    for(var i=0;i<types.length;i++){
      var d=ZOMB[types[i]];
      G.zombies.push({type:types[i],x:760+i*95,hp:d.hp*1.2,max:d.hp*1.2,dmg:d.dmg,spd:0.0001,
        ph:i,hitT:0,attacking:false,cd:99,face:1});
    }
    G.hero.x=420; G.hero.weapon='smg'; G.hero.ammo.smg=52; G.runCoins=64; G.kills=7;
    window.__mgd.step(0.4);
  },
  layout:function(){return {VW:VW,VH:VH,GROUND:GROUND}}
};
})();
</script>
