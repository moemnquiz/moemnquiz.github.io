<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#14102b">
  <title>moemn quiz</title>
  <link rel="stylesheet" href="app.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="10-icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="11-icon-512.png">
  <link rel="apple-touch-icon" href="10-icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="moemn quiz">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="كويز سريع بالعربي - يشتغل من غير نت">
</head>
<body>
  <div id="root"></div>
  <script src="1-quiz20.js"></script>
  <script>
  (function(){
    if('serviceWorker' in navigator){
      window.addEventListener('load',function(){
        navigator.serviceWorker.register('/sw.js',{scope:'/'}).catch(function(){});
      });
    }
    var deferred=null;
    window.addEventListener('beforeinstallprompt',function(e){
      e.preventDefault();deferred=e;showBtn();
    });
    function showBtn(){
      if(document.getElementById('pwa-install'))return;
      var b=document.createElement('button');
      b.id='pwa-install';
      b.type='button';
      b.textContent='\uD83D\uDCF2 \u062B\u0628\u0651\u062A \u0627\u0644\u062A\u0637\u0628\u064A\u0642';
      b.setAttribute('style','position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:99999;display:flex;align-items:center;gap:6px;padding:10px 16px;border-radius:999px;border:2px solid #ffd54a;background:linear-gradient(#3a2a8a,#14102b);color:#fff;font:800 15px system-ui,-apple-system,Tahoma,Arial,sans-serif;box-shadow:0 6px 18px #000a;cursor:pointer;direction:rtl');
      b.addEventListener('click',function(){
        b.remove();
        if(!deferred)return;
        deferred.prompt();
        deferred.userChoice.then(function(){deferred=null;}).catch(function(){deferred=null;});
      });
      document.body.appendChild(b);
    }
    window.addEventListener('appinstalled',function(){
      var b=document.getElementById('pwa-install');if(b)b.remove();
    });
  })();
  </script>
</body>
</html>
