<head>

<title>moemn run</title>
<meta name="description" content="لعبة جري مؤمن: اجري بقطة في ٣ حارات، اجمع العملات، وابعد عن العوائق.">
<link rel="icon" type="image/png" sizes="192x192" href="3-farm-icon-192.png">
<style>
  :root{--gold:#ffd93b;--ink:#12210f}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#123a12;
    font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;
    user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
  canvas{display:block;position:fixed;inset:0;width:100%;height:100%}

  /* ---------- splash ---------- */
  #splash{position:fixed;inset:0;z-index:500;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:2px;background:radial-gradient(circle at 50% 30%,#8ad85a 0%,#4a9a24 44%,#1f4a17 100%);
    cursor:pointer;animation:splashOut .5s ease-in 2.4s forwards}
  #splash .cat{width:clamp(160px,46vmin,226px);height:auto;filter:drop-shadow(0 12px 22px #00000055);
    animation:catIn .55s cubic-bezier(.2,1.4,.4,1) both}
  #splash .feather{transform-box:fill-box;transform-origin:15% 85%;animation:fwag 1s ease-in-out .4s 2 both}
  #splash .eyes{transform-box:fill-box;transform-origin:center;animation:cblink .3s ease-in-out .95s 1 both}
  #splash .studio{font-weight:900;font-size:clamp(13px,4.2vmin,19px);color:#4a2f10;
    background:linear-gradient(#ffe9a8,#ffc63f);border:2px solid #8a5a2e;border-radius:999px;
    padding:4px 14px;margin-top:2px;box-shadow:0 3px 10px #00000044;animation:cup .45s ease-out .55s both}
  #splash .mark{width:clamp(72px,20vmin,94px);height:auto;opacity:.92;margin-top:-6px;
    filter:drop-shadow(0 4px 10px #00000044);animation:cup .45s ease-out .42s both}
  #splash .cname{font-weight:900;font-size:clamp(22px,6.4vmin,33px);color:#ffd93b;
    text-shadow:0 3px 0 #1e4a16,0 8px 16px #00000066;letter-spacing:.5px;animation:cup .45s ease-out .66s both}
  #splash .ctag{font-weight:800;font-size:clamp(13px,3.9vmin,17px);color:#ffe9a8;
    text-shadow:0 2px 6px #00000055;animation:cup .45s ease-out .8s both}
  @keyframes splashOut{to{opacity:0;visibility:hidden}}
  @keyframes catIn{from{transform:translateY(26px) scale(.62) rotate(-7deg);opacity:0}to{transform:none;opacity:1}}
  @keyframes cup{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
  @keyframes cblink{0%,100%{transform:scaleY(1)}45%,60%{transform:scaleY(.1)}}
  @keyframes fwag{0%,100%{transform:rotate(0)}50%{transform:rotate(-11deg)}}

  /* ---------- hud ---------- */
  #hud{position:fixed;inset:0;z-index:20;pointer-events:none;display:flex;align-items:flex-start;
    gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 0;direction:rtl}
  .pill{display:flex;align-items:center;gap:6px;background:#0000005c;border:1px solid #ffffff2e;
    border-radius:999px;color:#fff;font-weight:900;font-size:16px;padding:7px 13px;
    backdrop-filter:blur(4px);text-shadow:0 1px 2px #0008}
  .pill small{font-size:11px;opacity:.8;font-weight:800}
  .sp{flex:1}
  .hbtn{pointer-events:auto;width:42px;height:42px;border-radius:50%;border:1px solid #ffffff33;
    background:#0000005c;color:#fff;font-size:19px;line-height:1;display:grid;place-items:center;
    backdrop-filter:blur(4px);padding:0}
  .hbtn:active{transform:scale(.94)}

  /* ---------- overlays ---------- */
  .ov{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;
    justify-content:center;gap:14px;padding:26px;text-align:center;
    background:radial-gradient(circle at 50% 40%,#0b1d0bcc,#04120acc 70%)}
  .ov.on{display:flex}
  .ov h1{margin:0;font-size:clamp(26px,8.4vmin,40px);color:#fff;text-shadow:0 3px 0 #0006}
  .ov .big{font-size:clamp(40px,13vmin,64px);font-weight:900;color:var(--gold);line-height:1;
    text-shadow:0 4px 0 #7a4b00,0 10px 22px #000a}
  .ov .lbl{color:#cfe6c4;font-size:15px;font-weight:800;margin-bottom:-6px}
  .ov .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  .ov .chip{background:#ffffff18;border:1px solid #ffffff2e;border-radius:16px;padding:9px 16px;
    color:#fff;font-weight:800;font-size:15px}
  .ov .chip b{color:var(--gold);font-size:18px}
  .go{pointer-events:auto;margin-top:6px;border:0;border-radius:20px;padding:16px 46px;
    font-size:22px;font-weight:900;color:#04240f;cursor:pointer;
    background:linear-gradient(#4ee06f,#1fa843);box-shadow:0 6px 0 #14702c,0 12px 22px #0008}
  .go:active{transform:translateY(3px);box-shadow:0 3px 0 #14702c}
  .hint{color:#a9c79c;font-size:14px;line-height:1.8;margin-top:4px}
  .hint b{color:#ffe066}
  .go.ghost{background:linear-gradient(#5c6b62,#3b4740);box-shadow:0 6px 0 #26302a,0 12px 22px #0007;
    font-size:17px;padding:11px 26px;margin-top:10px}
  #fade{position:fixed;inset:0;z-index:45;background:#000;opacity:0;pointer-events:none;
    transition:opacity .28s ease}
  #skinOv .wallet{background:#ffffff1c;border:1px solid #ffffff33;border-radius:999px;
    padding:8px 18px;color:#fff;font-weight:900;font-size:18px}
  #skinOv .wallet b{color:var(--gold)}
  .skins{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:430px;margin:4px 0}
  .scard{background:linear-gradient(180deg,#1c1844,#141130);border:2px solid #2a2652;border-radius:18px;
    padding:8px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;
    transition:transform .12s ease,border-color .12s ease}
  .scard:active{transform:scale(.97)}
  .scard.sel{border-color:#ffd93b;box-shadow:0 0 0 2px #ffd93b55,0 8px 20px #0008}
  .scard.locked{opacity:.72}
  .scard .sprev{width:82px;height:96px;display:block}
  #skinOv{background:radial-gradient(circle at 50% 28%,#16301d 0%,#060f09 72%)}
  .sname{color:#fff;font-weight:900;font-size:14px;margin-top:2px}
  .scost{font-size:12.5px;font-weight:800;color:#ffd93b}
  .scost.own{color:#7be08a}
  .scost.no{color:#ff8f8f}
</style>

<script>
(function(){
'use strict';

/* ===================== setup ===================== */
var cv = document.getElementById('c');
var ctx = cv.getContext('2d', { alpha: false });
var W = 0, H = 0, DPR = 1, horizon = 0, baseY = 0, cx = 0, ROAD = 0;
var bg = document.createElement('canvas');
var bgx = bg.getContext('2d');

var grassGrad = null, roadGrad = null;
var DEPTH = 14;         // perspective falloff
var PZ = 1.7;           // player distance from camera
var LANES = 3;
var SPEED0 = 15, SPEEDMAX = 62;

function tOf(z){ return 1 / (1 + z / DEPTH); }
function yOf(z){ return horizon + (baseY - horizon) * tOf(z); }
function xOf(wx, z){ return cx + wx * ROAD * tOf(z); }
function unitOf(z){ return (baseY - horizon) * tOf(z) * 0.44; }

function resize(){
  DPR = Math.min(1.5, window.devicePixelRatio || 1);
  W = Math.max(320, window.innerWidth);
  H = Math.max(420, window.innerHeight);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  horizon = H * 0.34;
  baseY = H * 0.99;
  cx = W / 2;
  ROAD = W * 0.40;
  grassGrad = ctx.createLinearGradient(0, horizon, 0, H);
  grassGrad.addColorStop(0, '#7cb85a');
  grassGrad.addColorStop(0.45, '#5ea343');
  grassGrad.addColorStop(1, '#3f7f30');
  roadGrad = ctx.createLinearGradient(0, horizon, 0, H);
  roadGrad.addColorStop(0, '#c9a878');
  roadGrad.addColorStop(0.5, '#c69a63');
  roadGrad.addColorStop(1, '#b98d55');
  paintBG();
}

/* ===================== background ===================== */
function paintBG(){
  bg.width = Math.round(W * DPR); bg.height = Math.round(H * DPR);
  bgx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // sky
  var sky = bgx.createLinearGradient(0, 0, 0, horizon + 4);
  sky.addColorStop(0, '#4fa8e8');
  sky.addColorStop(0.55, '#9fd8f5');
  sky.addColorStop(1, '#ffe3a8');
  bgx.fillStyle = sky;
  bgx.fillRect(0, 0, W, horizon + 4);
  // sun
  var sx = W * 0.76, sy = horizon * 0.42, sr = Math.min(W, H) * 0.075;
  var sg = bgx.createRadialGradient(sx, sy, sr * 0.2, sx, sy, sr * 3.1);
  sg.addColorStop(0, 'rgba(255,247,200,.95)');
  sg.addColorStop(0.3, 'rgba(255,226,140,.42)');
  sg.addColorStop(1, 'rgba(255,226,140,0)');
  bgx.fillStyle = sg; bgx.beginPath(); bgx.arc(sx, sy, sr * 3.1, 0, 7); bgx.fill();
  bgx.fillStyle = '#fff7cf'; bgx.beginPath(); bgx.arc(sx, sy, sr, 0, 7); bgx.fill();
  // clouds
  function cloud(x, y, s, a){
    bgx.fillStyle = 'rgba(255,255,255,' + a + ')';
    bgx.beginPath();
    bgx.arc(x, y, 20 * s, 0, 7);
    bgx.arc(x + 24 * s, y - 8 * s, 26 * s, 0, 7);
    bgx.arc(x + 54 * s, y + 2 * s, 18 * s, 0, 7);
    bgx.arc(x + 28 * s, y + 10 * s, 22 * s, 0, 7);
    bgx.fill();
  }
  cloud(W * 0.12, horizon * 0.26, 1.0, 0.85);
  cloud(W * 0.46, horizon * 0.17, 0.72, 0.62);
  cloud(W * 0.86, horizon * 0.32, 0.6, 0.5);
  // far hills
  function hill(yBase, amp, col, off){
    bgx.fillStyle = col; bgx.beginPath(); bgx.moveTo(-10, yBase);
    for (var x = -10; x <= W + 10; x += 12){
      bgx.lineTo(x, yBase - Math.sin((x + off) * 0.006) * amp - Math.sin((x + off) * 0.017) * amp * 0.4);
    }
    bgx.lineTo(W + 10, horizon + 6); bgx.lineTo(-10, horizon + 6); bgx.closePath(); bgx.fill();
  }
  hill(horizon - 2, 30, '#7fb46a', 0);
  hill(horizon + 4, 20, '#5f9450', 320);
  // treeline on the horizon
  bgx.fillStyle = '#3f7a3a';
  for (var tx = -20; tx < W + 30; tx += 26){
    var th = 16 + ((tx * 7919) % 13);
    bgx.beginPath(); bgx.arc(tx, horizon - 2, th * 0.55, 0, 7); bgx.fill();
  }
  bgx.fillStyle = '#2f6330';
  bgx.fillRect(0, horizon, W, 5);
}

/* ===================== ground / road ===================== */
var scrollPhase = 0;

function drawGround(){
  // grass base
  ctx.fillStyle = grassGrad;
  ctx.fillRect(0, horizon, W, H - horizon);

  // scrolling grass bands (speed feel)
  var bandH = 6.4;
  var off = scrollPhase % bandH;
  for (var i = 0; i < 13; i++){
    var z1 = i * bandH - off, z2 = z1 + bandH;
    if (z1 < 0) continue;
    if (z1 > 90) break;
    var y1 = yOf(z1), y2 = yOf(Math.max(0.001, z2));
    ctx.fillStyle = (i % 2) ? 'rgba(0,0,0,.045)' : 'rgba(255,255,255,.035)';
    ctx.fillRect(0, y2, W, Math.max(0.6, y1 - y2));
  }

  // road trapezoid
  var steps = 14, prevX = null, prevY = null;
  ctx.beginPath();
  for (var k = 0; k <= steps; k++){
    var z = (k === steps) ? 120 : Math.pow(k / steps, 2.1) * 60;
    var xl = xOf(-1.62, z), y = yOf(z);
    if (k === 0) ctx.moveTo(xl, y); else ctx.lineTo(xl, y);
  }
  for (var k2 = steps; k2 >= 0; k2--){
    var z2b = (k2 === steps) ? 120 : Math.pow(k2 / steps, 2.1) * 60;
    ctx.lineTo(xOf(1.62, z2b), yOf(z2b));
  }
  ctx.closePath();
  ctx.fillStyle = roadGrad; ctx.fill();
  var nearY = yOf(0);
  if (nearY < H) ctx.fillRect(0, nearY - 1, W, H - nearY + 1);

  // road edge stripes
  ctx.strokeStyle = 'rgba(255,255,255,.35)';
  ctx.lineWidth = Math.max(2, W * 0.006);
  ctx.beginPath();
  for (var e = 0; e <= steps; e++){
    var ze = (e === steps) ? 120 : Math.pow(e / steps, 2.1) * 60;
    var xe = xOf(-1.56, ze), ye = yOf(ze);
    if (e === 0) ctx.moveTo(xe, ye); else ctx.lineTo(xe, ye);
  }
  ctx.stroke();
  ctx.beginPath();
  for (var e2 = 0; e2 <= steps; e2++){
    var ze2 = (e2 === steps) ? 120 : Math.pow(e2 / steps, 2.1) * 60;
    var xe2 = xOf(1.56, ze2), ye2 = yOf(ze2);
    if (e2 === 0) ctx.moveTo(xe2, ye2); else ctx.lineTo(xe2, ye2);
  }
  ctx.stroke();

  // lane dashes
  ctx.fillStyle = 'rgba(255,255,255,.5)';
  var dash = 4.6, gap = 3.8, span = dash + gap;
  var d0 = scrollPhase % span;
  for (var d = 0; d < 14; d++){
    var zA = d * span - d0, zB = zA + dash;
    if (zB < 0.15) continue;
    if (zA > 100) break;
    zA = Math.max(0.15, zA);
    var ya = yOf(zA), yb = yOf(zB);
    var wA = Math.max(0.7, unitOf(zA) * 0.035), wB = Math.max(0.7, unitOf(zB) * 0.035);
    for (var li = 0; li < 2; li++){
      var lx = li ? 0.5 : -0.5;
      ctx.beginPath();
      ctx.moveTo(xOf(lx - 0.018, zA), ya);
      ctx.lineTo(xOf(lx + 0.018, zA), ya);
      ctx.lineTo(xOf(lx + 0.018, zB), yb);
      ctx.lineTo(xOf(lx - 0.018, zB), yb);
      ctx.closePath(); ctx.fill();
    }
  }
}

/* side fences + trees */
function drawSide(){
  var step = 5.5, off = scrollPhase % step;
  for (var i = 0; i < 10; i++){
    var z = i * step - off;
    if (z < 0.4 || z > 95) continue;
    var u = unitOf(z), y = yOf(z);
    for (var si = 0; si < 2; si++){
      var side = si ? 1 : -1;
      var x = xOf(side * 2.05, z);
      var ph = u * 0.55, pw = Math.max(1.4, u * 0.07);
      ctx.fillStyle = '#8a6238';
      ctx.fillRect(x - pw / 2, y - ph, pw, ph);
      ctx.fillStyle = '#a57a49';
      ctx.fillRect(x - pw / 2, y - ph, pw, Math.max(1, ph * 0.16));
      // rail
      if (i < 9){
        var z2 = z + step;
        var x2 = xOf(side * 2.05, z2), y2 = yOf(z2), u2 = unitOf(z2);
        ctx.strokeStyle = '#b08a55';
        ctx.lineWidth = Math.max(1, u * 0.055);
        ctx.beginPath();
        ctx.moveTo(x, y - u * 0.42);
        ctx.lineTo(x2, y2 - u2 * 0.42);
        ctx.stroke();
      }
    }
  }
  // trees further out
  var tstep = 13, toff = (scrollPhase * 0.9) % tstep;
  for (var j = 0; j < 6; j++){
    var zt = j * tstep - toff;
    if (zt < 1 || zt > 110) continue;
    var ut = unitOf(zt), yt = yOf(zt);
    [-1, 1].forEach(function(side, si){
      var xt = xOf(side * 3.4, zt);
      var h = ut * (1.5 + (si ? 0.2 : 0));
      ctx.fillStyle = '#6b4a2a';
      ctx.fillRect(xt - ut * 0.06, yt - h * 0.42, ut * 0.12, h * 0.42);
      var r = ut * 0.42;
      ctx.fillStyle = '#2f7a35';
      ctx.beginPath(); ctx.arc(xt, yt - h * 0.62, r, 0, 7); ctx.fill();
      ctx.fillStyle = '#3c9440';
      ctx.beginPath(); ctx.arc(xt - r * 0.42, yt - h * 0.78, r * 0.72, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(xt + r * 0.46, yt - h * 0.74, r * 0.66, 0, 7); ctx.fill();
    });
  }
}

/* ===================== helpers ===================== */
function rr(c, x, y, w, h, r){
  if (w < 0){ x += w; w = -w; }
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r); c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  c.lineTo(x + r, y + h); c.quadraticCurveTo(x, y + h, x, y + h - r);
  c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y);
  c.closePath();
}

/* ===================== objects ===================== */
var WARM_Z = 56;              /* metres of clear road at the start of every run */
var OBSZ = 0.8;               /* obstacle visuals are drawn 20% smaller */
var OBS = {
  hay:  { h: 0.52, dodge: 'jump' },
  gate: { h: 1.05, dodge: 'slide' },
  rock: { h: 1.15, dodge: 'lane' }
};

function drawCoin(o, t){
  var u = unitOf(o.z);
  if (u < 1) return;
  var x = xOf(o.lane - 1, o.z);
  var y = yOf(o.z) - o.y * u;
  var r = u * 0.088;
  var spin = Math.abs(Math.cos(t * 3.4 + o.z * 0.9));
  ctx.save();
  ctx.translate(x, y);
  // glow
  ctx.globalAlpha = 0.3;
  ctx.fillStyle = '#ffe97a';
  ctx.beginPath(); ctx.arc(0, 0, r * 1.35, 0, 7); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.scale(Math.max(0.18, spin), 1);
  ctx.beginPath(); ctx.arc(0, 0, r, 0, 7);
  ctx.fillStyle = '#ffc11f'; ctx.fill();
  ctx.lineWidth = Math.max(1, r * 0.16); ctx.strokeStyle = '#a96f00'; ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, r * 0.56, 0, 7);
  ctx.strokeStyle = '#fff3b0'; ctx.lineWidth = Math.max(1, r * 0.12); ctx.stroke();
  ctx.restore();
}

function drawHay(o){
  var u = unitOf(o.z);
  if (u < 1) return;
  var x = xOf(o.lane - 1, o.z), y = yOf(o.z);
  var w = u * 0.72 * OBSZ, h = u * 0.5 * OBSZ;
  // shadow
  ctx.fillStyle = 'rgba(0,0,0,.22)';
  ctx.beginPath(); ctx.ellipse(x, y, w * 0.55, h * 0.2, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#e8c469';
  rr(ctx, x - w / 2, y - h, w, h, h * 0.22); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.18)';
  rr(ctx, x - w / 2, y - h, w, h * 0.34, h * 0.18); ctx.fill();
  ctx.strokeStyle = '#8d6a22'; ctx.lineWidth = Math.max(1, u * 0.014); ctx.stroke();
  // straw lines
  ctx.strokeStyle = 'rgba(140,105,34,.55)';
  ctx.lineWidth = Math.max(1, u * 0.012);
  for (var i = 1; i <= 3; i++){
    ctx.beginPath();
    ctx.moveTo(x - w / 2 + w * i / 4, y - h * 0.92);
    ctx.lineTo(x - w / 2 + w * i / 4, y - h * 0.08);
    ctx.stroke();
  }
  // bands
  ctx.fillStyle = '#8d6a22';
  ctx.fillRect(x - w / 2, y - h * 0.68, w, Math.max(1, h * 0.09));
  ctx.fillRect(x - w / 2, y - h * 0.34, w, Math.max(1, h * 0.09));
}

function drawGate(o){
  var u = unitOf(o.z);
  if (u < 1) return;
  var x = xOf(o.lane - 1, o.z), y = yOf(o.z);
  var w = u * 0.92 * OBSZ, top = y - u * 1.0 * OBSZ, bot = y - u * 0.66 * OBSZ;
  // posts
  ctx.fillStyle = '#7a5432';
  var pw2 = Math.max(1.6, u * 0.055);
  ctx.fillRect(x - w / 2, top, pw2, y - top);
  ctx.fillRect(x + w / 2 - pw2, top, pw2, y - top);
  // beam
  ctx.fillStyle = '#dcd5c4';
  ctx.fillRect(x - w / 2, top, w, bot - top);
  // warning stripes
  ctx.save();
  ctx.beginPath(); ctx.rect(x - w / 2, top, w, bot - top); ctx.clip();
  ctx.fillStyle = '#d8492e';
  var sw = w * 0.22;
  for (var i = -2; i < 8; i++){
    ctx.beginPath();
    ctx.moveTo(x - w / 2 + i * sw, bot);
    ctx.lineTo(x - w / 2 + i * sw + sw * 0.5, bot);
    ctx.lineTo(x - w / 2 + i * sw + sw * 0.5 + (bot - top), top);
    ctx.lineTo(x - w / 2 + i * sw + (bot - top), top);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  ctx.strokeStyle = '#6b6355'; ctx.lineWidth = Math.max(1, u * 0.012);
  ctx.strokeRect(x - w / 2, top, w, bot - top);
}

function drawRock(o){
  var u = unitOf(o.z);
  if (u < 1) return;
  var x = xOf(o.lane - 1, o.z), y = yOf(o.z);
  var w = u * 0.7 * OBSZ, h = u * 0.9 * OBSZ;
  ctx.fillStyle = 'rgba(0,0,0,.22)';
  ctx.beginPath(); ctx.ellipse(x, y, w * 0.6, h * 0.13, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#78828c';
  ctx.beginPath();
  ctx.moveTo(x - w * 0.5, y);
  ctx.lineTo(x - w * 0.36, y - h * 0.62);
  ctx.lineTo(x - w * 0.08, y - h);
  ctx.lineTo(x + w * 0.26, y - h * 0.84);
  ctx.lineTo(x + w * 0.5, y - h * 0.34);
  ctx.lineTo(x + w * 0.42, y);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#3f474e'; ctx.lineWidth = Math.max(1, u * 0.014); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.18)';
  ctx.beginPath();
  ctx.moveTo(x - w * 0.1, y - h * 0.92);
  ctx.lineTo(x + w * 0.22, y - h * 0.78);
  ctx.lineTo(x + w * 0.06, y - h * 0.52);
  ctx.closePath(); ctx.fill();
}

function drawObject(o, t){
  if (o.kind === 'coin') drawCoin(o, t);
  else if (o.kind === 'hay') drawHay(o);
  else if (o.kind === 'gate') drawGate(o);
  else drawRock(o);
}

var SK = SKINS[0];

var catG = null, catGid = '';
function catGrads(){
  if (catG && catGid === SK.id) return catG;
  var b = ctx.createLinearGradient(0, -70, 0, -16);
  b.addColorStop(0, SK.fur1); b.addColorStop(0.65, SK.fur2); b.addColorStop(1, SK.fur3);
  var c = ctx.createLinearGradient(0, -64, 0, -12);
  c.addColorStop(0, SK.cape1); c.addColorStop(0.6, SK.cape2); c.addColorStop(1, SK.cape3);
  var h = ctx.createLinearGradient(0, -128, 0, -86);
  h.addColorStop(0, SK.hat1); h.addColorStop(1, SK.hat2);
  var hd = ctx.createRadialGradient(-7, -93, 3, 0, -84, 30);
  hd.addColorStop(0, SK.head1); hd.addColorStop(1, SK.head2);
  catG = { body: b, cape: c, hat: h, head: hd };
  catGid = SK.id;
  return catG;
}

function drawCat(px, py, scale, t, st){
  var stride = st.stride, sAmt = st.slideAmt || 0, air = st.air, land = st.land || 0;
  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(st.tilt);
  ctx.scale(scale, scale);
  if (sAmt > 0.001){
    ctx.translate(0, 8 * sAmt);
    ctx.scale(1 + 0.2 * sAmt, 1 - 0.46 * sAmt);
  }
  if (land > 0.001){
    ctx.scale(1 + 0.14 * land, 1 - 0.18 * land);
  }
  if (air){
    var st2 = Math.max(-0.12, Math.min(0.12, -st.vyK * 0.02));
    ctx.scale(1 - st2, 1 + st2);
  }
  var bob = air ? 0 : Math.sin(stride * 2) * 2.2;

  // ---- tail ----
  ctx.save();
  ctx.translate(4, -26 + bob);
  var sw = Math.sin(t * 3.2) * 9 + st.tailKick;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.bezierCurveTo(22, -2, 32 + sw * 0.4, -26, 27 + sw, -50);
  ctx.lineWidth = 10; ctx.strokeStyle = SK.fur2; ctx.stroke();
  ctx.lineWidth = 4.6; ctx.strokeStyle = SK.line;
  ctx.setLineDash([5, 10]); ctx.stroke(); ctx.setLineDash([]);
  ctx.restore();

  // ---- legs ----
  var swing = air ? -7 : Math.sin(stride) * 8;
  var swing2 = air ? 7 : Math.sin(stride + Math.PI) * 8;
  function leg(dx, dy){
    ctx.fillStyle = SK.fur2;
    rr(ctx, dx - 8, -24 + dy + bob, 16, 14, 6); ctx.fill();
    ctx.fillStyle = SK.boot;
    rr(ctx, dx - 10, -11 + dy + bob, 20, 11, 4); ctx.fill();
    ctx.fillStyle = SK.line;
    rr(ctx, dx - 10, -3 + dy + bob, 20, 4, 2); ctx.fill();
  }
  leg(-13, -swing);
  leg(13, -swing2);

  // ---- body ----
  var CG = catGrads();
  ctx.fillStyle = CG.body;
  ctx.beginPath();
  ctx.moveTo(-21, -62 + bob);
  ctx.quadraticCurveTo(-25, -38, -20, -20 + bob);
  ctx.quadraticCurveTo(0, -12 + bob, 20, -20 + bob);
  ctx.quadraticCurveTo(25, -38, 21, -62 + bob);
  ctx.quadraticCurveTo(0, -70 + bob, -21, -62 + bob);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = SK.line; ctx.lineWidth = 1.6; ctx.stroke();

  // ---- cape over the back ----
  var fl = Math.sin(t * 7.5) * 2.5 + (air ? 6 : 0);
  ctx.fillStyle = CG.cape;
  ctx.beginPath();
  ctx.moveTo(-17, -63 + bob);
  ctx.quadraticCurveTo(0, -68 + bob, 17, -63 + bob);
  ctx.quadraticCurveTo(26 + fl, -42, 28 + fl, -16);
  ctx.quadraticCurveTo(14 + fl, -8, 0, -12);
  ctx.quadraticCurveTo(-14 + fl, -8, -28 + fl, -16);
  ctx.quadraticCurveTo(-26 + fl, -42, -17, -63 + bob);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = SK.cape3; ctx.lineWidth = 1.6; ctx.stroke();
  // cape fold
  ctx.strokeStyle = 'rgba(0,0,0,.20)'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(0, -60 + bob); ctx.lineTo(0, -14); ctx.stroke();

  // ---- arms ----
  var armSw = air ? -9 : Math.sin(stride + Math.PI) * 7;
  function arm(dx, dy){
    ctx.fillStyle = SK.fur2;
    rr(ctx, dx - 6, -58 + dy + bob, 12, 18, 6); ctx.fill();
    ctx.fillStyle = SK.glove;
    ctx.beginPath(); ctx.arc(dx, -40 + dy + bob, 7.5, 0, 7); ctx.fill();
  }
  arm(-24, -armSw * 0.35);
  arm(24, armSw * 0.35);

  // ---- head ----
  var hy = -84 + bob + (air ? -2 : 0);
  ctx.fillStyle = CG.head;
  ctx.beginPath(); ctx.arc(0, hy, 25, 0, 7); ctx.fill();
  ctx.strokeStyle = SK.line; ctx.lineWidth = 1.7; ctx.stroke();
  // back-of-head shading
  ctx.fillStyle = 'rgba(0,0,0,.10)';
  ctx.beginPath(); ctx.arc(0, hy + 6, 18, 0.15 * Math.PI, 0.85 * Math.PI); ctx.fill();

  // ---- ears ----
  function ear(sgn){
    ctx.fillStyle = SK.fur2;
    ctx.beginPath();
    ctx.moveTo(sgn * 21, hy - 9);
    ctx.lineTo(sgn * 29, hy - 33);
    ctx.lineTo(sgn * 8, hy - 21);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = SK.line; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = SK.earIn;
    ctx.beginPath();
    ctx.moveTo(sgn * 20, hy - 13);
    ctx.lineTo(sgn * 25, hy - 27);
    ctx.lineTo(sgn * 13, hy - 20);
    ctx.closePath(); ctx.fill();
  }
  ear(-1); ear(1);

  // ---- hat ----
  var haty = hy - 18;
  ctx.fillStyle = CG.hat;
  ctx.beginPath();
  ctx.moveTo(-21, haty);
  ctx.quadraticCurveTo(-19, haty - 25, 0, haty - 27);
  ctx.quadraticCurveTo(19, haty - 25, 21, haty);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = SK.hat2; ctx.lineWidth = 1.9; ctx.stroke();
  ctx.fillStyle = SK.band;
  ctx.beginPath();
  ctx.moveTo(-21, haty - 4);
  ctx.quadraticCurveTo(0, haty - 10, 21, haty - 4);
  ctx.lineTo(21, haty + 1);
  ctx.quadraticCurveTo(0, haty - 5, -21, haty + 1);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = SK.hat2; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.fillStyle = CG.hat;
  ctx.beginPath(); ctx.ellipse(0, haty + 3, 33, 8, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = SK.hat2; ctx.lineWidth = 1.9; ctx.stroke();

  // ---- feather ----
  ctx.save();
  ctx.translate(12, haty - 20);
  ctx.rotate(-0.45 + Math.sin(t * 6) * 0.07);
  ctx.fillStyle = SK.accent;
  ctx.beginPath();
  ctx.moveTo(0, 2); ctx.bezierCurveTo(10, -12, 20, -22, 31, -27);
  ctx.bezierCurveTo(29, -10, 17, 3, 2, 8);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = SK.line; ctx.lineWidth = 1.6; ctx.stroke();
  ctx.restore();

  ctx.restore();
}

/* ===================== game state ===================== */
var G = {
  state: 'splash',        // splash | ready | run | over | pause
  t: 0, speed: SPEED0, dist: 0, coins: 0,
  objs: [], nextZ: 40,
  best: 0, bestCoins: 0,
  wallet: 50, owned: ['farmer'], skin: 'farmer', pausedForSkins: false
};
var P = { lane: 1, x: 0, jumpY: 0, vy: 0, sliding: 0, stride: 0, air: false, tilt: 0, slideAnim: 0, land: 0 };

try { G.best = parseInt(localStorage.getItem('moemnrun_best') || '0', 10) || 0; } catch(e){}
try { G.bestCoins = parseInt(localStorage.getItem('moemnrun_coins') || '0', 10) || 0; } catch(e){}

function pick(a){ return a[(Math.random() * a.length) | 0]; }

function add(kind, lane, z, y){
  G.objs.push({ kind: kind, lane: lane, z: z, y: y || 0, done: false });
}

function spawnAhead(){
  while (G.nextZ < 78){
    var z = G.nextZ;
    var coinGap = Math.max(2.0, G.speed * 0.125);
    var r = Math.random();
    /* warm-up: no obstacles or hay bales for the first stretch of a run,
       only coins, so the player gets a clear road to find their feet */
    if (z < WARM_Z) r = 0.12;
    var lanes = [0, 1, 2];
    if (r < 0.28){
      var ln = pick(lanes), n = 4 + ((Math.random() * 3) | 0);
      for (var i = 0; i < n; i++) add('coin', ln, z + i * coinGap, 0.46);
    } else if (r < 0.5){
      add(pick(['hay', 'gate', 'rock']), pick(lanes), z, 0);
    } else if (r < 0.7){
      var a = pick(lanes), b = pick([0, 1, 2].filter(function(l){ return l !== a; }));
      add(pick(['hay', 'gate', 'rock']), a, z, 0);
      add(pick(['hay', 'gate']), b, z + 0.8, 0);
    } else if (r < 0.87){
      var l2 = pick(lanes);
      add('hay', l2, z, 0);
      for (var j = -2; j <= 2; j++) add('coin', l2, z + j * coinGap * 0.85, 1.0 - Math.abs(j) * 0.09);
    } else {
      var l3 = pick(lanes);
      add('gate', l3, z, 0);
      for (var j2 = 0; j2 < 4; j2++) add('coin', l3, z + j2 * coinGap * 0.8, 0.3);
    }
    var gapTime = 1.08 + Math.random() * 0.55;
    G.nextZ = z + Math.max(12, G.speed * gapTime);
  }
}

function resetGame(){
  G.objs = []; G.nextZ = 34; G.speed = SPEED0; G.dist = 0; G.coins = 0; G.t = 0;
  P.lane = 1; P.x = 0; P.jumpY = 0; P.vy = 0; P.sliding = 0; P.air = false; P.tilt = 0;
  spawnAhead();
}

function startGame(){
  resetGame();
  G.state = 'run';
  document.getElementById('startOv').classList.remove('on');
  document.getElementById('overOv').classList.remove('on');
  document.getElementById('pauseOv').classList.remove('on');
  audioStart();
  sfx('start');
}

function gameOver(){
  if (G.state !== 'run') return;
  G.state = 'over';
  sfx('hit');
  musicStop();
  var d = Math.floor(G.dist);
  if (d > G.best){ G.best = d; try { localStorage.setItem('moemnrun_best', String(d)); } catch(e){} }
  if (G.coins > G.bestCoins){ G.bestCoins = G.coins; try { localStorage.setItem('moemnrun_coins', String(G.coins)); } catch(e){} }
  document.getElementById('oDist').textContent = d;
  document.getElementById('oCoins').textContent = G.coins;
  document.getElementById('oBest').textContent = G.best;
  saveProgress();
  document.getElementById('overOv').classList.add('on');
}

function collect(o){
  G.coins++;
  G.wallet++;
  if (G.wallet % 5 === 0) saveProgress();
  sfx('coin');
  // little pop
  G.pops.push({ x: xOf(o.lane - 1, o.z), y: yOf(o.z) - o.y * unitOf(o.z), t: 0 });
}
G.pops = [];

function collide(o){
  var safe = false;
  if (o.kind === 'hay' && P.jumpY > 0.5) safe = true;
  if (o.kind === 'gate' && P.sliding > 0) safe = true;
  if (safe){ sfx('whoosh'); return; }
  gameOver();
}

function update(dt){
  G.t += dt;
  P.stride += dt * (4.5 + G.speed * 0.55);
  for (var p = G.pops.length - 1; p >= 0; p--){
    G.pops[p].t += dt;
    if (G.pops[p].t > 0.5) G.pops.splice(p, 1);
  }
  if (G.state !== 'run') return;

  G.speed = Math.min(SPEEDMAX, G.speed + dt * 0.52);
  G.dist += G.speed * dt;
  scrollPhase += G.speed * dt;

  var target = P.lane - 1;
  P.x += (target - P.x) * Math.min(1, dt * 11);
  P.tilt = (target - P.x) * 0.2;

  if (P.air){
    P.vy -= 25 * dt;
    P.jumpY += P.vy * dt;
    if (P.jumpY <= 0){ P.jumpY = 0; P.vy = 0; P.air = false; P.land = 0.22; }
  }
  if (P.sliding > 0) P.sliding = Math.max(0, P.sliding - dt);
  P.slideAnim += ((P.sliding > 0 ? 1 : 0) - P.slideAnim) * Math.min(1, dt * 22);
  if (P.land > 0) P.land = Math.max(0, P.land - dt);

  G.nextZ -= G.speed * dt;
  for (var i = G.objs.length - 1; i >= 0; i--){
    var o = G.objs[i];
    o.z -= G.speed * dt;
    if (!o.done && o.z <= PZ){
      o.done = true;
      if (o.lane === P.lane){
        if (o.kind === 'coin'){
          if (Math.abs(o.y - P.jumpY) < 0.85) collect(o);
        } else collide(o);
      }
    }
    if (o.z < PZ - 0.2){ G.objs.splice(i, 1); continue; }
  }
  spawnAhead();
}

function jump(){
  if (G.state !== 'run' || P.air) return;
  P.air = true; P.vy = 8.9; P.sliding = 0; P.slideAnim = 0;
  sfx('jump');
}
function slide(){
  if (G.state !== 'run') return;
  if (P.air){ P.vy = -20; return; }   // fast fall
  P.sliding = 0.5;
  sfx('slide');
}
function move(dir){
  if (G.state !== 'run') return;
  var nl = Math.max(0, Math.min(2, P.lane + dir));
  if (nl !== P.lane){ P.lane = nl; sfx('swish'); }
}

/* ===================== render ===================== */
var vign = null;
function makeVignette(){
  vign = ctx.createRadialGradient(cx, H * 0.55, Math.min(W, H) * 0.35, cx, H * 0.55, Math.max(W, H) * 0.78);
  vign.addColorStop(0, 'rgba(0,0,0,0)');
  vign.addColorStop(1, 'rgba(0,0,0,.34)');
}

function drawPlayer(){
  var u = unitOf(PZ), gy = yOf(PZ);
  var px = xOf(P.x, PZ);
  var py = gy - P.jumpY * u;

  // shadow
  var shrink = Math.max(0.42, 1 - P.jumpY * 0.5);
  ctx.fillStyle = 'rgba(0,0,0,' + (0.28 * shrink) + ')';
  ctx.beginPath();
  ctx.ellipse(px, gy + 2, u * 0.30 * shrink, u * 0.085 * shrink, 0, 0, 7);
  ctx.fill();

  // dust puffs
  if (G.state === 'run' && !P.air){
    for (var d = 0; d < 3; d++){
      var ph = ((G.t * 2.2 + d * 0.33) % 1);
      var a = (1 - ph) * 0.28;
      ctx.fillStyle = 'rgba(214,190,150,' + a + ')';
      ctx.beginPath();
      ctx.arc(px + (d - 1) * u * 0.10, gy - ph * u * 0.12, u * (0.035 + ph * 0.05), 0, 7);
      ctx.fill();
    }
  }

  drawCat(px, py, u / 135, G.t, {
    stride: P.stride,
    slideAmt: P.slideAnim,
    land: P.land > 0 ? Math.min(1, P.land / 0.22) : 0,
    air: P.air,
    tilt: P.tilt,
    tailKick: P.air ? 6 : 0
  });
}

function render(){
  ctx.drawImage(bg, 0, 0, W, H);
  drawGround();
  drawSide();

  var far = [], near = [];
  for (var i = 0; i < G.objs.length; i++){
    var o = G.objs[i];
    if (o.z > PZ) far.push(o); else near.push(o);
  }
  far.sort(function(a, b){ return b.z - a.z; });
  near.sort(function(a, b){ return b.z - a.z; });
  for (var f = 0; f < far.length; f++) drawObject(far[f], G.t);

  drawPlayer();

  for (var n = 0; n < near.length; n++) drawObject(near[n], G.t);

  // coin pops
  for (var p = 0; p < G.pops.length; p++){
    var pp = G.pops[p], k = pp.t / 0.5;
    ctx.globalAlpha = 1 - k;
    ctx.fillStyle = '#ffe97a';
    ctx.font = '900 ' + Math.round(16 + k * 10) + 'px system-ui,Tahoma,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('+1', pp.x, pp.y - k * 40);
    ctx.globalAlpha = 1;
  }

  // speed streaks
  var sp = (G.speed - 20) / 20;
  if (G.state === 'run' && sp > 0){
    ctx.strokeStyle = 'rgba(255,255,255,' + (0.10 + sp * 0.16) + ')';
    ctx.lineWidth = 2;
    for (var s = 0; s < 8; s++){
      var ang = (s / 8) * Math.PI * 2 + G.t * 0.4;
      var r0 = Math.min(W, H) * 0.42, r1 = Math.min(W, H) * (0.62 + sp * 0.2);
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(ang) * r0, H * 0.5 + Math.sin(ang) * r0 * 0.7);
      ctx.lineTo(cx + Math.cos(ang) * r1, H * 0.5 + Math.sin(ang) * r1 * 0.7);
      ctx.stroke();
    }
  }

  if (vign){ ctx.fillStyle = vign; ctx.fillRect(0, 0, W, H); }

  // hud numbers
  var elC = document.getElementById('coins'), elD = document.getElementById('dist');
  if (elC.textContent !== String(G.wallet)) elC.textContent = G.wallet;
  var dm = String(Math.floor(G.dist));
  if (elD.textContent !== dm) elD.textContent = dm;
}

/* ===================== audio ===================== */
var AC = null, master = null, musicGain = null, muted = false;
try { muted = localStorage.getItem('moemnrun_mute') === '1'; } catch(e){}

function audioStart(){
  if (!AC){
    var Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return;
    AC = new Ctor();
    master = AC.createGain();
    master.gain.value = muted ? 0 : 0.9;
    master.connect(AC.destination);
    musicGain = AC.createGain();
    musicGain.gain.value = 0.16;
    musicGain.connect(master);
  }
  if (AC.state === 'suspended') AC.resume();
  if (G.state === 'run') musicStart();
}

function tone(freq, dur, type, vol, delay, glide){
  if (!AC || muted) return;
  var t0 = AC.currentTime + (delay || 0);
  var o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t0);
  if (glide) o.frequency.exponentialRampToValueAtTime(Math.max(40, glide), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol || 0.15, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(master);
  o.start(t0); o.stop(t0 + dur + 0.03);
}

function noise(dur, vol, cutoff, delay){
  if (!AC || muted) return;
  var t0 = AC.currentTime + (delay || 0);
  var len = Math.max(1, Math.floor(AC.sampleRate * dur));
  var buf = AC.createBuffer(1, len, AC.sampleRate);
  var data = buf.getChannelData(0);
  for (var i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
  var src = AC.createBufferSource(); src.buffer = buf;
  var flt = AC.createBiquadFilter(); flt.type = 'lowpass'; flt.frequency.value = cutoff || 1200;
  var g = AC.createGain();
  g.gain.setValueAtTime(vol || 0.12, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(flt); flt.connect(g); g.connect(master);
  src.start(t0);
}

function sfx(name){
  if (!AC) return;
  if (name === 'coin'){ tone(1046, 0.07, 'square', 0.11); tone(1568, 0.1, 'square', 0.08, 0.055); }
  else if (name === 'jump'){ tone(320, 0.16, 'sine', 0.12, 0, 780); }
  else if (name === 'slide'){ noise(0.26, 0.1, 900); }
  else if (name === 'swish'){ tone(520, 0.07, 'triangle', 0.07, 0, 300); }
  else if (name === 'hit'){ noise(0.4, 0.22, 700); tone(150, 0.4, 'sawtooth', 0.16, 0, 45); }
  else if (name === 'whoosh'){ noise(0.16, 0.07, 2400); }
  else if (name === 'start'){ tone(523, 0.1, 'triangle', 0.13); tone(659, 0.1, 'triangle', 0.13, 0.1); tone(784, 0.18, 'triangle', 0.13, 0.2); }
}

/* original chiptune loop (hijaz-ish, made for this game) */
var LEAD = [74,0,70,0, 69,0,67,66, 67,0,69,0, 70,0,0,0,
            69,0,67,0, 66,0,63,0, 62,0,63,66, 67,0,0,0];
var BASS = [38,0,0,0, 41,0,0,0, 43,0,0,0, 38,0,0,0];
var musicTimer = null, step = 0, nextTime = 0, STEP = 0.135;

function midi(m){ return 440 * Math.pow(2, (m - 69) / 12); }

function playStep(i, when){
  var n = LEAD[i % LEAD.length];
  if (n){
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = 'square'; o.frequency.value = midi(n);
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(0.075, when + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, when + 0.13);
    o.connect(g); g.connect(musicGain);
    o.start(when); o.stop(when + 0.16);
  }
  if (i % 4 === 0){
    var b = BASS[(i / 4) % BASS.length];
    if (b){
      var o2 = AC.createOscillator(), g2 = AC.createGain();
      o2.type = 'triangle'; o2.frequency.value = midi(b);
      g2.gain.setValueAtTime(0.0001, when);
      g2.gain.exponentialRampToValueAtTime(0.13, when + 0.015);
      g2.gain.exponentialRampToValueAtTime(0.0001, when + 0.4);
      o2.connect(g2); g2.connect(musicGain);
      o2.start(when); o2.stop(when + 0.45);
    }
  }
  if (i % 8 === 4) noise(0.05, 0.05, 5000, when - AC.currentTime);
}

function musicStart(){
  if (!AC || muted || musicTimer) return;
  step = 0; nextTime = AC.currentTime + 0.1;
  musicTimer = setInterval(function(){
    if (!AC) return;
    while (nextTime < AC.currentTime + 0.25){
      playStep(step, nextTime);
      step = (step + 1) % 32;
      nextTime += STEP;
    }
  }, 70);
}
function musicStop(){
  if (musicTimer){ clearInterval(musicTimer); musicTimer = null; }
}

/* ===================== skins ===================== */
function saveProgress(){
  try {
    localStorage.setItem('moemnrun_wallet', String(G.wallet));
    localStorage.setItem('moemnrun_owned', G.owned.join(','));
    localStorage.setItem('moemnrun_skin', G.skin);
  } catch(e){}
}
function loadProgress(){
  try {
    var savedWallet = localStorage.getItem('moemnrun_wallet');
    G.wallet = savedWallet === null ? 50 : (parseInt(savedWallet, 10) || 0);
    /* one-time welcome balance so a fresh or near-empty wallet starts at 50 coins */
    if (G.wallet < 50 && localStorage.getItem('moemnrun_welcome50') !== '1'){
      G.wallet = 50;
      localStorage.setItem('moemnrun_welcome50', '1');
      saveProgress();
    }
    var o = localStorage.getItem('moemnrun_owned');
    if (o) G.owned = o.split(',').filter(function(x){ return !!x; });
    if (G.owned.indexOf('farmer') < 0) G.owned.push('farmer');
    var sid = localStorage.getItem('moemnrun_skin');
    for (var i = 0; i < SKINS.length; i++){
      if (SKINS[i].id === sid && G.owned.indexOf(sid) >= 0){ G.skin = sid; SK = SKINS[i]; catG = null; }
    }
  } catch(e){}
}

var prevCanvas = null;
function skinPreviewURL(skin){
  if (!prevCanvas){
    prevCanvas = document.createElement('canvas');
    prevCanvas.width = 176; prevCanvas.height = 208;
  }
  var c2 = prevCanvas.getContext('2d');
  var oldCtx = ctx, oldG = catG, oldId = catGid, oldSK = SK;
  ctx = c2; catG = null; catGid = ''; SK = skin;
  c2.setTransform(2, 0, 0, 2, 0, 0);
  c2.clearRect(0, 0, 88, 104);
  drawCat(44, 100, 0.74, 0, { stride: 0, slideAmt: 0, land: 0, air: false, tilt: 0, tailKick: 0 });
  ctx = oldCtx; catG = oldG; catGid = oldId; SK = oldSK;
  try { return prevCanvas.toDataURL('image/png'); } catch(e){ return ''; }
}

function renderSkins(){
  var list = document.getElementById('skinList');
  var html = '';
  for (var i = 0; i < SKINS.length; i++){
    var sk = SKINS[i];
    var owned = G.owned.indexOf(sk.id) >= 0, sel = G.skin === sk.id;
    var label = sel ? 'مختار' : (owned ? 'مفتوح' : (sk.cost ? '🪙 ' + sk.cost : 'مجاني'));
    var cls = sel ? 'own' : (owned ? 'own' : (G.wallet >= sk.cost ? '' : 'no'));
    html += '<div class="scard' + (sel ? ' sel' : '') + (owned ? '' : ' locked') + '" data-i="' + i + '">'
         + '<img class="sprev" alt="" src="' + skinPreviewURL(sk) + '">'
         + '<div class="sname">' + sk.name + '</div>'
         + '<div class="scost ' + cls + '">' + label + '</div></div>';
  }
  list.innerHTML = html;
  document.getElementById('wCoins').textContent = G.wallet;
  var cards = list.querySelectorAll('.scard');
  for (var j = 0; j < cards.length; j++){
    cards[j].addEventListener('click', function(){
      pickSkin(parseInt(this.getAttribute('data-i'), 10));
    });
  }
}

function pickSkin(i){
  var sk = SKINS[i];
  if (!sk) return;
  if (G.owned.indexOf(sk.id) < 0){
    if (G.wallet < sk.cost) return;
    G.wallet -= sk.cost;
    G.owned.push(sk.id);
  }
  G.skin = sk.id;
  SK = sk;
  catG = null;
  saveProgress();
  renderSkins();
}

function openSkins(){
  if (G.state === 'run'){ G.state = 'pause'; G.pausedForSkins = true; musicStop(); }
  renderSkins();
  document.getElementById('skinOv').classList.add('on');
}
function closeSkins(){
  document.getElementById('skinOv').classList.remove('on');
  if (G.pausedForSkins){ G.pausedForSkins = false; G.state = 'run'; audioStart(); }
}

/* ===================== input ===================== */
var tx = 0, ty = 0, tracking = false;

function pt(e){
  if (e.changedTouches && e.changedTouches.length) return e.changedTouches[0];
  if (e.touches && e.touches.length) return e.touches[0];
  return e;
}
function onDown(e){
  if (G.state !== 'run') return;
  var p = pt(e); tx = p.clientX; ty = p.clientY; tracking = true;
}
function onUp(e){
  if (!tracking) return;
  tracking = false;
  if (G.state !== 'run') return;
  var p = pt(e);
  var dx = p.clientX - tx, dy = p.clientY - ty;
  var adx = Math.abs(dx), ady = Math.abs(dy);
  if (adx < 20 && ady < 20){ jump(); return; }
  if (adx > ady) move(dx > 0 ? 1 : -1);
  else if (dy < 0) jump();
  else slide();
}

cv.addEventListener('touchstart', function(e){ if (e.cancelable) e.preventDefault(); onDown(e); }, { passive: false });
cv.addEventListener('touchend', function(e){ if (e.cancelable) e.preventDefault(); onUp(e); }, { passive: false });
cv.addEventListener('touchmove', function(e){ if (e.cancelable) e.preventDefault(); }, { passive: false });
cv.addEventListener('mousedown', onDown);
window.addEventListener('mouseup', onUp);

document.addEventListener('keydown', function(e){
  var k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A'){ move(-1); e.preventDefault(); }
  else if (k === 'ArrowRight' || k === 'd' || k === 'D'){ move(1); e.preventDefault(); }
  else if (k === 'ArrowUp' || k === 'w' || k === 'W' || k === ' '){ jump(); e.preventDefault(); }
  else if (k === 'ArrowDown' || k === 's' || k === 'S'){ slide(); e.preventDefault(); }
  else if (k === 'p' || k === 'P'){ togglePause(); }
  else if (k === 'm' || k === 'M'){ toggleMute(); }
  else if (k === 'Enter' && G.state !== 'run'){ startGame(); }
});

/* ===================== ui ===================== */
function syncMute(){
  var b = document.getElementById('bMute');
  b.textContent = muted ? '🔇' : '🔊';
}
function toggleMute(){
  muted = !muted;
  try { localStorage.setItem('moemnrun_mute', muted ? '1' : '0'); } catch(e){}
  if (master) master.gain.value = muted ? 0 : 0.9;
  if (muted) musicStop(); else if (G.state === 'run') musicStart();
  syncMute();
}
function exitGame(){
  musicStop();
  saveProgress();
  /* inside the APK the native bridge closes the app; in a browser tab fall
     back to closing the tab, or going back if the tab was not opened by script */
  try {
    if (window.MoemnApp && typeof window.MoemnApp.exit === 'function'){
      window.MoemnApp.exit();
      return;
    }
  } catch(e){}
  try { window.close(); } catch(e){}
  setTimeout(function(){
    try {
      if (document.hidden) return;
      if (window.history && window.history.length > 1) window.history.back();
    } catch(e){}
  }, 300);
}

function togglePause(){
  if (G.state === 'run'){
    G.state = 'pause';
    musicStop();
    document.getElementById('pauseOv').classList.add('on');
  } else if (G.state === 'pause'){
    G.state = 'run';
    document.getElementById('pauseOv').classList.remove('on');
    audioStart();
  }
}

document.getElementById('bMute').addEventListener('click', function(e){ e.stopPropagation(); audioStart(); toggleMute(); });
document.getElementById('bPause').addEventListener('click', function(e){ e.stopPropagation(); togglePause(); });
document.getElementById('bStart').addEventListener('click', function(e){ e.stopPropagation(); startGame(); });
document.getElementById('bAgain').addEventListener('click', function(e){ e.stopPropagation(); startGame(); });
document.getElementById('bResume').addEventListener('click', function(e){ e.stopPropagation(); togglePause(); });
document.getElementById('bSkins').addEventListener('click', function(e){ e.stopPropagation(); openSkins(); });
document.getElementById('bSkins2').addEventListener('click', function(e){ e.stopPropagation(); openSkins(); });
document.getElementById('bCloseSkins').addEventListener('click', function(e){ e.stopPropagation(); closeSkins(); });
document.getElementById('bExit').addEventListener('click', function(e){ e.stopPropagation(); exitGame(); });
document.getElementById('bExit2').addEventListener('click', function(e){ e.stopPropagation(); exitGame(); });

document.addEventListener('visibilitychange', function(){
  if (document.hidden && G.state === 'run') togglePause();
});

/* ===================== loop ===================== */
var last = 0;
function frame(ts){
  if (!last) last = ts;
  var dt = (ts - last) / 1000;
  last = ts;
  if (!isFinite(dt) || dt < 0) dt = 0;
  if (dt > 0.05) dt = 0.05;
  update(dt);
  render();
  requestAnimationFrame(frame);
}

function init(){
  resize();
  makeVignette();
  window.addEventListener('resize', function(){
    resize(); makeVignette();
  });
  loadProgress();
  G.state = 'ready';
  document.getElementById('startOv').classList.add('on');
  document.getElementById('bestStart').textContent = G.best;
  syncMute();
  resetGame();
  G.state = 'ready';
  requestAnimationFrame(frame);
}
window.__moemnrun = { G: G, P: P, start: startGame, update: update, move: move, jump: jump, slide: slide, render: render, spawnAhead: spawnAhead, exit: exitGame };
init();
})();
</script>
